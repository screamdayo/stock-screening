document.querySelector('.view').onclick=e=>{let b=e.target.closest('[data-mode]');if(!b)return;S.mode=b.dataset.mode;if(S.mode==='history'&&S.f==='unrated')S.f='all';filter();render()};filters.onclick=e=>{let b=e.target.closest('[data-f]');if(!b)return;S.f=b.dataset.f;filter();render()};let tx=null;document.addEventListener('touchstart',e=>{if(S.mode==='today')tx=e.changedTouches[0].clientX},{passive:true});document.addEventListener('touchend',e=>{if(tx==null||S.mode!=='today')return;let d=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(d)>70)move(d>0?-1:1)},{passive:true});load();
