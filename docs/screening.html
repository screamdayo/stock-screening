const OWNER='screamdayo',REPO='stock-screening',HK='screening-judgement-history:v1';const S={data:null,items:[],filtered:[],i:0,f:'all',range:'3m',mode:'today',remote:[],px:{},metrics:{}};const date=()=>S.data?.generated_at?.slice(0,10)||new Date().toISOString().slice(0,10);const loadH=()=>{try{let v=JSON.parse(localStorage.getItem(HK)||'[]');return Array.isArray(v)?v:[]}catch{return[]}};const saveH=v=>localStorage.setItem(HK,JSON.stringify(v));const id=(d,c)=>`${d}:${c}`;const cur=c=>loadH().find(x=>x.id===id(date(),c));const rate=c=>cur(c)?.rating||'';const fmt=(n,d=0)=>n==null||isNaN(+n)?'—':(+n).toLocaleString('ja-JP',{maximumFractionDigits:d});const pct=n=>n==null||isNaN(+n)?'—':`${+n>=0?'+':''}${(+n).toFixed(2)}%`;const vol=n=>n==null||isNaN(+n)?'—':+n>=1e8?`${(+n/1e8).toFixed(1)}億`:+n>=1e4?`${(+n/1e4).toFixed(0)}万`:(+n).toLocaleString('ja-JP');const ma=(a,n)=>a.map((_,i)=>i<n-1?null:a.slice(i-n+1,i+1).reduce((x,y)=>x+y,0)/n);const rlabel=x=>x==='skip'?'見送り':x;const slabel=x=>x.signal_label||(x.signal_type==='bottom_reversal'?'大底反転':x.signal_type==='pullback_reacceleration'?'押し目再上昇':'');const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const cid=s=>String(s).replace(/[^a-zA-Z0-9_-]/g,'_');
function mergeRemote(){let l=loadH(),m=new Map(l.map(x=>[x.id,x]));for(const x of S.remote||[])if(x&&x.id&&!m.has(x.id))m.set(x.id,x);saveH([...m.values()])}

function filter(reset=true){if(S.mode==='today'){S.filtered=S.items.filter(x=>{let v=rate(x.code);return S.f==='all'||(S.f==='unrated'&&!v)||v===S.f});if(reset)S.i=0;if(S.i>=S.filtered.length)S.i=Math.max(0,S.filtered.length-1)}document.querySelectorAll('.chip').forEach(b=>b.classList.toggle('on',b.dataset.f===S.f))}
async function price(code){if(S.px[code])return S.px[code];let r=await fetch(`prices/${code}.json?v=${Date.now()}`,{cache:'no-store'});if(!r.ok)throw Error('price');return S.px[code]=await r.json()}

async function load(){try{let [a,b]=await Promise.all([fetch(`screening.json?v=${Date.now()}`,{cache:'no-store'}),fetch(`judgement_history.json?v=${Date.now()}`,{cache:'no-store'}).catch(()=>null)]);if(!a.ok)throw Error(`screening.json ${a.status}`);S.data=await a.json();S.items=S.data.items||[];if(b&&b.ok)S.remote=await b.json();mergeRemote();filter();let d=new Date(S.data.generated_at);meta.innerHTML=`${S.data.count}件<br>${d.toLocaleString('ja-JP')}`;render()}catch(e){root.innerHTML=`<div class="err">読み込み失敗<br>${esc(e.message)}</div>`}}

async function today(){if(!S.filtered.length){root.innerHTML='<div class="empty">この条件の銘柄はありません</div>';return}let x=S.filtered[S.i],sg=slabel(x),r=rate(x.code);root.innerHTML=`<section class="card"><div class="head"><div><div class="code">${esc(x.code)}</div><div class="name">${esc(x.name||x.code)}</div>${sg?`<span class="sig">${esc(sg)}</span>`:''}</div><div><div class="count">${S.i+1} / ${S.filtered.length}</div><div class="close">${fmt(x.close)}円</div><div id="chg" class="chg">—</div></div></div><div class="stats"><div class="stat"><div class="k">MA5</div><div id="m5" class="v">—</div></div><div class="stat"><div class="k">MA25</div><div id="m25" class="v">—</div></div><div class="stat"><div class="k">MA75</div><div id="m75" class="v">—</div></div><div class="stat"><div class="k">出来高</div><div id="vv" class="v">—</div></div></div><div class="ct"><div class="legend">ローソク + MA5 / 25 / 75 + 出来高</div><div class="ranges"><button class="range ${S.range==='1m'?'on':''}" data-r="1m">1か月</button><button class="range ${S.range==='3m'?'on':''}" data-r="3m">3か月</button><button class="range ${S.range==='all'?'on':''}" data-r="all">全期間</button></div></div><div id="chart"></div><div class="judge"><button data-j="A" class="${r==='A'?'sa':''}">A</button><button data-j="B" class="${r==='B'?'sb':''}">B</button><button data-j="skip" class="${r==='skip'?'ss':''}">見送り</button></div><div class="nav"><button id="prev">← 前へ</button><button id="next">次へ →</button></div><div class="links"><a target="_blank" href="https://kabutan.jp/stock/chart?code=${x.code}">かぶたん</a><a target="_blank" href="https://finance.yahoo.co.jp/quote/${x.code}.T">Yahoo!ファイナンス</a></div></section>`;document.querySelectorAll('[data-j]').forEach(b=>b.onclick=()=>setRate(x,b.dataset.j));prev.onclick=()=>move(-1);next.onclick=()=>move(1);document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{S.range=b.dataset.r;render()});draw(x)}
