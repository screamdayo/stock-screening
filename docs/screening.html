<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>スクリーニング結果</title><script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script><style>
@import url('https://fonts.googleapis.com/css2?family=DotGothic16&display=swap');
:root{
  --bg1:#72d98e;--bg2:#69afd0;
  --panel:#260b29;--panel2:#321036;--panel3:#1c071f;
  --frame:#83e7b7;--frame2:#d9f7bd;--line:#74d9d7;
  --ink:#fff6c9;--dim:#c9d8cb;--acc:#f6dc69;
  --up:#ff77b7;--down:#66d6ff;--a:#59efac;--b:#ffe06a;--skip:#d1d8d2;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{
  min-height:100%;
  background:
    conic-gradient(
      var(--bg1) 0 25%,
      var(--bg2) 25% 50%,
      var(--bg1) 50% 75%,
      var(--bg2) 75% 100%
    ) 0 0 / 64px 64px;
  image-rendering:pixelated;
}
body{
  margin:0 auto;
  max-width:760px;
  min-height:100vh;
  padding:max(16px,env(safe-area-inset-top)) 10px max(34px,env(safe-area-inset-bottom));
  color:var(--ink);
  font-family:"DotGothic16","MS Gothic","Hiragino Kaku Gothic ProN",monospace;
  letter-spacing:.02em;
  overflow-x:hidden;
  background:transparent;
}
button,a{font:inherit}
button{cursor:pointer}
.top,.card,.hcard,.summary,.view,.filters{
  position:relative;
}
.top,.card,.hcard,.summary{
  background:linear-gradient(180deg,var(--panel2),var(--panel));
  border:4px solid var(--frame);
  border-radius:3px;
  box-shadow:
    0 0 0 2px #163b3f,
    0 0 0 5px var(--frame2),
    7px 7px 0 rgba(25,27,43,.28);
}
.top{
  display:flex;justify-content:space-between;align-items:flex-end;gap:12px;
  margin:3px 5px 16px;padding:14px 14px 13px;
}
.top:after,.card:after,.hcard:after,.summary:after{
  content:"";position:absolute;inset:5px;border:1px solid rgba(116,217,215,.38);pointer-events:none;
}
.eye{
  font-size:10px;color:var(--frame);letter-spacing:.14em;text-transform:uppercase;
}
h1{font-size:23px;line-height:1.15;margin:5px 0 0;text-shadow:2px 2px 0 #100414}
.meta{font-size:11px;color:var(--dim);text-align:right;line-height:1.55}

.view{
  display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 5px 13px;
}
.view button,.chip,.range,.judge button,.nav button,.links a,.sync,.acts button{
  border:3px solid var(--frame);
  background:var(--panel);
  color:var(--ink);
  border-radius:2px;
  box-shadow:0 0 0 1px #173d40,0 0 0 3px var(--frame2);
  text-shadow:1px 1px 0 #110414;
}
.view button{padding:10px 8px}
.view .on,.chip.on{
  background:#7e36bf;
  color:#fff;
  border-color:#9df0c5;
}
.filters{
  display:flex;gap:10px;overflow:auto;padding:4px 7px 14px;scrollbar-width:none;
}
.filters::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:8px 13px;font-size:11px}

.card,.hcard,.summary{overflow:hidden}
.card{margin:0 5px}
.head{
  display:flex;justify-content:space-between;gap:10px;padding:18px 17px 14px;
  border-bottom:2px solid var(--line);
}
.code{font-size:11px;color:var(--frame)}
.name{font-size:20px;font-weight:400;margin-top:4px;line-height:1.35}
.sig{
  display:inline-block;margin-top:8px;border:2px solid var(--line);
  padding:4px 8px;font-size:10px;color:var(--ink);background:var(--panel3);
}
.count{font-size:11px;color:var(--dim);text-align:right}
.close{font-size:20px;text-align:right;white-space:nowrap}
.chg{text-align:right;font-size:12px}
.up{color:var(--up)}.down{color:var(--down)}

.stats{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
  gap:8px;padding:12px 14px 10px;
}
.stat,.sumbox,.pb{
  background:var(--panel3);
  border:2px solid #4a706f;
  border-radius:0;
  padding:9px;
}
.k{font-size:9px;color:var(--frame)}
.v{font-size:12px;margin-top:3px}
.ct{
  display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;
  padding:7px 14px 4px;
}
.legend{font-size:10px;color:var(--dim)}
.ranges{display:flex;gap:5px}
.range{padding:5px 8px;font-size:10px;box-shadow:none;border-width:2px}
.range.on{background:#7e36bf;color:#fff}
#chart{height:500px;width:100%;background:var(--panel)}
#chart,.hchart,#chart *,.hchart *{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-user-drag:none}

.judge{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:12px 14px}
.judge button{padding:11px 6px;font-size:14px}
.judge .sa{color:var(--a)}.judge .sb{color:var(--b)}.judge .ss{color:var(--skip)}
.nav,.links{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:2px 14px 12px}
.nav button,.links a{padding:10px;text-align:center;text-decoration:none;font-size:12px}
.links a{color:var(--acc)}

.hh{
  display:flex;justify-content:space-between;align-items:center;gap:8px;
  padding:7px 7px 13px;color:#18383a;font-size:11px;
}
.sync{padding:8px 10px;color:var(--ink)}
.summary{padding:14px;margin:0 5px 14px}
.sumtitle{font-size:12px;margin-bottom:10px}
.sumgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.sumbox .big{font-size:18px;margin-top:3px}
.history{display:grid;gap:15px;padding:0 5px}
.hcard{padding:16px}
.hrow{display:flex;justify-content:space-between;gap:8px}
.hname{font-size:16px}
.badge{padding:4px 8px;font-size:11px;border:2px solid var(--line);background:var(--panel3)}
.badge-A{color:var(--a)}.badge-B{color:var(--b)}.badge-skip{color:var(--skip)}
.perf{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:10px}
.metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:6px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}
.acts button{padding:9px;font-size:10px}
.acts .chartbtn{color:var(--acc)}
.hchartwrap{display:none;margin-top:12px;border:2px solid var(--line);background:var(--panel3)}
.hchartwrap.open{display:block}
.hchartnote{font-size:10px;color:var(--dim);padding:9px 10px 0}
.hchart{height:430px;width:100%}
.empty,.err{
  margin:10px 5px;padding:48px 20px;text-align:center;
  color:var(--ink);background:var(--panel);
  border:4px solid var(--frame);
  box-shadow:0 0 0 2px #163b3f,0 0 0 5px var(--frame2);
}
.help{
  margin:15px 5px 0;padding:11px 12px;text-align:center;color:var(--ink);font-size:10px;
  background:var(--panel);border:3px solid var(--frame);
  box-shadow:0 0 0 1px #163b3f,0 0 0 3px var(--frame2);
}
.syncnote{font-size:10px;color:#18383a;padding:0 7px 10px}
@media(max-width:420px){
  body{padding-left:8px;padding-right:8px}
  h1{font-size:20px}.name{font-size:18px}
  #chart{height:530px}.hchart{height:450px}
  .top{padding:12px 11px}.stats{padding-left:11px;padding-right:11px}
}
</style></head><body><div class="top"><div><div class="eye">SCREENING REVIEW</div><h1>スクリーニング結果</h1></div><div id="meta" class="meta">読込中…</div></div><div class="view"><button data-mode="today" class="on">今日の判定</button><button data-mode="history">判定履歴</button></div><div id="filters" class="filters"><button class="chip on" data-f="all">すべて</button><button class="chip" data-f="unrated">未判定</button><button class="chip" data-f="A">A</button><button class="chip" data-f="B">B</button><button class="chip" data-f="skip">見送り</button></div><div id="root"><div class="empty">読み込み中…</div></div><div id="help" class="help">左右スワイプで前後へ。判定は端末とGitHubの両方に残せます。</div><script>

async function loadMetrics(h){for(const e of h){if(S.metrics[e.id])continue;try{let p=await price(e.code),bars=p.bars||p;S.metrics[e.id]=calcMetric(e,bars)}catch{S.metrics[e.id]=null}}let hs=loadH();for(const [key,elid] of [['A','wa'],['B','wb']]){let arr=hs.filter(x=>x.rating===key).map(x=>S.metrics[x.id]).filter(m=>m&&m.mature),w=arr.filter(m=>m.win).length;document.getElementById(elid).textContent=arr.length?`${(w/arr.length*100).toFixed(0)}% (${w}/${arr.length})`:'—'}historyRefreshMetrics()}
function historyRefreshMetrics(){document.querySelectorAll('.hcard').forEach(()=>{})}
async function toggleHChart(k){let e=loadH().find(x=>x.id===k);if(!e)return;let wrap=document.getElementById('wrap_'+cid(k)),el=document.getElementById('hc_'+cid(k));if(wrap.classList.contains('open')){wrap.classList.remove('open');return}wrap.classList.add('open');try{let p=await price(e.code),bars=p.bars||p,idx=bars.findIndex(z=>String(z.t).slice(0,10)===e.date);if(idx<0)idx=Math.max(0,bars.length-40);let b=bars.slice(Math.max(0,idx-20),Math.min(bars.length,idx+16)),xs=b.map(z=>z.t),c=b.map(z=>+z.c),m5a=ma(c,5),m25a=ma(c,25),tk=xticks(xs);Plotly.newPlot(el,[{x:xs,open:b.map(z=>+z.o),high:b.map(z=>+z.h),low:b.map(z=>+z.l),close:c,type:'candlestick',increasing:{line:{color:'#ff5d6c'}},decreasing:{line:{color:'#4d8cff'}}},{x:xs,y:m5a,type:'scatter',mode:'lines',line:{width:1.3,color:'#f2b134'}},{x:xs,y:m25a,type:'scatter',mode:'lines',line:{width:1.2,color:'#35d68c'}}],{margin:{l:42,r:10,t:10,b:28},paper_bgcolor:'#260b29',plot_bgcolor:'#260b29',font:{color:'#fff6c9',size:9},showlegend:false,dragmode:false,xaxis:{rangeslider:{visible:false},gridcolor:'#4a706f',fixedrange:true,...tk},yaxis:{gridcolor:'#4a706f',fixedrange:true}},{displayModeBar:false,responsive:true,staticPlot:true,scrollZoom:false,doubleClick:false})}catch{el.innerHTML='<div class="err">チャート読込失敗</div>'}}
document.querySelectorAll('.view button').forEach(b=>b.onclick=()=>{S.mode=b.dataset.mode;document.getElementById('filters').style.display=S.mode==='today'?'flex':'none';filter();render()});document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{S.f=b.dataset.f;filter();render()});let sx=0;document.addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});document.addEventListener('touchend',e=>{if(S.mode!=='today'||!S.filtered.length)return;let dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)<60)return;S.i=(S.i+(dx<0?1:-1)+S.filtered.length)%S.filtered.length;today()},{passive:true});load();
</script></body></html>
