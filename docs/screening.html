<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>スクリーニング結果</title><script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script><style>
:root{--bg:#0a0f1c;--p:#121a2b;--p2:#182339;--line:#263252;--ink:#eef2fb;--dim:#8e98b2;--acc:#f2b134;--up:#ff5d6c;--down:#4d8cff;--a:#35d68c;--b:#f2b134;--skip:#8993ac}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow-x:hidden}body{max-width:720px;margin:auto;padding:max(14px,env(safe-area-inset-top)) 8px max(30px,env(safe-area-inset-bottom))}button{font:inherit}.top{display:flex;justify-content:space-between;align-items:flex-end;padding:8px 4px 12px}.eye{font:10px ui-monospace;color:var(--acc);letter-spacing:.13em}h1{font-size:20px;margin:3px 0 0}.meta{font-size:11px;color:var(--dim);text-align:right}.view{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 2px 10px}.view button,.chip{border:1px solid var(--line);background:var(--p);color:var(--dim);border-radius:12px;padding:10px}.view .on,.chip.on{border-color:var(--acc);color:var(--ink);background:rgba(242,177,52,.1)}.filters{display:flex;gap:7px;overflow:auto;padding:0 2px 10px;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}.chip{border-radius:999px;white-space:nowrap;padding:8px 12px;font-size:11px}.card,.hcard,.summary{background:linear-gradient(180deg,var(--p2),var(--p));border:1px solid var(--line);border-radius:18px;overflow:hidden}.head{display:flex;justify-content:space-between;gap:10px;padding:15px}.code{font:11px ui-monospace;color:var(--dim)}.name{font-size:20px;font-weight:850;margin-top:3px}.sig{display:inline-block;margin-top:6px;border:1px solid var(--line);border-radius:999px;padding:4px 8px;font-size:10px;color:var(--dim)}.count{font:12px ui-monospace;color:var(--dim);text-align:right}.close{font-size:20px;font-weight:900;text-align:right;white-space:nowrap}.chg{text-align:right;font-size:12px}.up{color:var(--up)}.down{color:var(--down)}.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:0 12px 10px}.stat{background:#091225;border:1px solid var(--line);border-radius:12px;padding:9px}.k{font-size:9px;color:var(--dim)}.v{font:12px ui-monospace;margin-top:2px}.ct{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:5px 12px 0}.legend{font-size:10px;color:var(--dim)}.ranges{display:flex;border:1px solid var(--line);border-radius:9px;padding:2px}.range{border:0;background:transparent;color:var(--dim);padding:6px 9px;border-radius:7px;font-size:10px}.range.on{background:var(--p2);color:var(--ink)}#chart{height:500px;width:100%}#chart,.hchart,#chart *,.hchart *{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-user-drag:none}.judge{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:10px 12px}.judge button{border:1px solid var(--line);background:#0b1427;color:var(--ink);border-radius:12px;padding:12px;font-weight:850}.judge .sa{border-color:var(--a);color:var(--a)}.judge .sb{border-color:var(--b);color:var(--b)}.judge .ss{border-color:var(--skip);color:#c5ccda}.nav,.links{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 12px 10px}.nav button,.links a{border:1px solid var(--line);background:var(--p2);color:var(--ink);border-radius:10px;padding:10px;text-align:center;text-decoration:none;font-size:12px}.links a{color:var(--acc)}.hh{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:2px 2px 10px;color:var(--dim);font-size:11px}.sync{border:1px solid var(--acc);background:rgba(242,177,52,.1);color:var(--ink);border-radius:9px;padding:8px 10px}.summary{padding:12px;margin-bottom:10px}.sumtitle{font-size:12px;font-weight:800;margin-bottom:9px}.sumgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.sumbox{background:#091225;border:1px solid var(--line);border-radius:10px;padding:9px}.sumbox .big{font-size:18px;font-weight:900;margin-top:2px}.history{display:grid;gap:9px}.hcard{padding:12px}.hrow{display:flex;justify-content:space-between;gap:8px}.hname{font-size:16px;font-weight:800}.badge{border-radius:999px;padding:4px 8px;font-size:11px;font-weight:900}.badge-A{color:var(--a);border:1px solid var(--a)}.badge-B{color:var(--b);border:1px solid var(--b)}.badge-skip{color:#c5ccda;border:1px solid var(--skip)}.perf{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:9px}.pb{background:#091225;border:1px solid var(--line);border-radius:8px;padding:7px;min-width:0}.pb .v{font-size:11px}.metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:6px}.acts{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}.acts button{border:1px solid var(--line);background:var(--p2);color:var(--ink);border-radius:8px;padding:9px;text-align:center;font-size:10px}.acts .chartbtn{color:var(--acc)}.hchartwrap{display:none;margin-top:9px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#101827}.hchartwrap.open{display:block}.hchartnote{font-size:10px;color:var(--dim);padding:9px 10px 0}.hchart{height:430px;width:100%}.empty,.err{text-align:center;padding:48px 20px;color:var(--dim)}.help{text-align:center;color:var(--dim);font-size:10px;padding:12px 8px}.syncnote{font-size:10px;color:var(--dim);padding:0 2px 10px}@media(max-width:420px){#chart{height:530px}.hchart{height:450px}.perf{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style></head><body><div class="top"><div><div class="eye">SCREENING REVIEW</div><h1>スクリーニング結果</h1></div><div id="meta" class="meta">読込中…</div></div><div class="view"><button data-mode="today" class="on">今日の判定</button><button data-mode="history">判定履歴</button></div><div id="filters" class="filters"><button class="chip on" data-f="all">すべて</button><button class="chip" data-f="unrated">未判定</button><button class="chip" data-f="A">A</button><button class="chip" data-f="B">B</button><button class="chip" data-f="skip">見送り</button></div><div id="root"><div class="empty">読み込み中…</div></div><div id="help" class="help">左右スワイプで前後へ。判定は端末とGitHubの両方に残せます。</div><script>
const OWNER='screamdayo',REPO='stock-screening',HK='screening-judgement-history:v1';const S={data:null,items:[],filtered:[],i:0,f:'all',range:'3m',mode:'today',remote:[],px:{},metrics:{}};const date=()=>S.data?.generated_at?.slice(0,10)||new Date().toISOString().slice(0,10);const loadH=()=>{try{let v=JSON.parse(localStorage.getItem(HK)||'[]');return Array.isArray(v)?v:[]}catch{return[]}};const saveH=v=>localStorage.setItem(HK,JSON.stringify(v));const id=(d,c)=>`${d}:${c}`;const cur=c=>loadH().find(x=>x.id===id(date(),c));const rate=c=>cur(c)?.rating||'';const fmt=(n,d=0)=>n==null||isNaN(+n)?'—':(+n).toLocaleString('ja-JP',{maximumFractionDigits:d});const pct=n=>n==null||isNaN(+n)?'—':`${+n>=0?'+':''}${(+n).toFixed(2)}%`;const vol=n=>n==null||isNaN(+n)?'—':+n>=1e8?`${(+n/1e8).toFixed(1)}億`:+n>=1e4?`${(+n/1e4).toFixed(0)}万`:(+n).toLocaleString('ja-JP');const ma=(a,n)=>a.map((_,i)=>i<n-1?null:a.slice(i-n+1,i+1).reduce((x,y)=>x+y,0)/n);const rlabel=x=>x==='skip'?'見送り':x;const slabel=x=>x.signal_label||(x.signal_type==='bottom_reversal'?'大底反転':x.signal_type==='pullback_reacceleration'?'押し目再上昇':'');const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const cid=s=>String(s).replace(/[^a-zA-Z0-9_-]/g,'_');const xticks=(xs,max=6)=>{let cross=new Set(xs.map(x=>String(x).slice(0,4))).size>1,step=Math.max(1,Math.ceil((xs.length-1)/Math.max(1,max-1))),v=[];for(let i=0;i<xs.length;i+=step)v.push(xs[i]);if(xs.length&&v.at(-1)!==xs.at(-1))v.push(xs.at(-1));return{tickmode:'array',tickvals:v,ticktext:v.map(x=>cross?String(x).slice(0,10):String(x).slice(5,10))}};
function mergeRemote(){let l=loadH(),m=new Map(l.map(x=>[x.id,x]));for(const x of S.remote||[])if(x&&x.id&&!m.has(x.id))m.set(x.id,x);saveH([...m.values()])}
function setRate(item,v){let h=loadH(),k=id(date(),item.code),i=h.findIndex(x=>x.id===k);if(i>=0&&h[i].rating===v)h.splice(i,1);else{let e={id:k,date:date(),code:item.code,name:item.name||item.code,rating:v,close:Number(item.close)||null,signal_type:item.signal_type||'',signal_label:item.signal_label||'',judged_at:new Date().toISOString()};if(i>=0)h[i]=e;else h.push(e)}saveH(h);filter(false);render()}
function unsynced(){let rm=new Set((S.remote||[]).map(x=>x.id+':'+x.rating));return loadH().filter(x=>!rm.has(x.id+':'+x.rating))}
function syncIssue(){let u=unsynced();if(!u.length){alert('未同期の履歴はありません');return}let compact=u.map(x=>({id:x.id,date:x.date,code:x.code,name:x.name,rating:x.rating,close:x.close,signal_type:x.signal_type,signal_label:x.signal_label,judged_at:x.judged_at}));let body='SCREENING_HISTORY_JSON\n```json\n'+JSON.stringify(compact)+'\n```';let url=`https://github.com/${OWNER}/${REPO}/issues/new?title=${encodeURIComponent('[screening-history-sync] '+date())}&body=${encodeURIComponent(body)}`;window.open(url,'_blank')}
function filter(reset=true){if(S.mode==='today'){S.filtered=S.items.filter(x=>{let v=rate(x.code);return S.f==='all'||(S.f==='unrated'&&!v)||v===S.f});if(reset)S.i=0;if(S.i>=S.filtered.length)S.i=Math.max(0,S.filtered.length-1)}document.querySelectorAll('.chip').forEach(b=>b.classList.toggle('on',b.dataset.f===S.f))}
async function price(code){if(S.px[code])return S.px[code];let r=await fetch(`prices/${code}.json?v=${Date.now()}`,{cache:'no-store'});if(!r.ok)throw Error('price');return S.px[code]=await r.json()}
function calcMetric(e,b){let base=+e.close;if(!base)return null;let i=b.findIndex(z=>String(z.t).slice(0,10)===e.date);if(i<0)i=b.findIndex(z=>String(z.t).slice(0,10)>e.date)-1;if(i<0)return null;let after=b.slice(i+1),d5=after[4],d10=after[9],win=after.slice(0,10),high=win.length?Math.max(...win.map(z=>+z.h)):null,low=win.length?Math.min(...win.map(z=>+z.l)):null;return{r5:d5?(+d5.c/base-1)*100:null,r10:d10?(+d10.c/base-1)*100:null,maxUp:high!=null?(high/base-1)*100:null,maxDown:low!=null?(low/base-1)*100:null,mature:!!d10,win:d10?+d10.c>base:null}}
async function load(){try{let [a,b]=await Promise.all([fetch(`screening.json?v=${Date.now()}`,{cache:'no-store'}),fetch(`judgement_history.json?v=${Date.now()}`,{cache:'no-store'}).catch(()=>null)]);if(!a.ok)throw Error(`screening.json ${a.status}`);S.data=await a.json();S.items=S.data.items||[];if(S.items.length>=5)S.items.sort((x,y)=>Math.abs(x?.ma5_vs_ma25_pct??Infinity)-Math.abs(y?.ma5_vs_ma25_pct??Infinity));if(b&&b.ok)S.remote=await b.json();mergeRemote();filter();let d=new Date(S.data.generated_at);meta.innerHTML=`${S.data.count}件<br>${d.toLocaleString('ja-JP')}`;render()}catch(e){root.innerHTML=`<div class="err">読み込み失敗<br>${esc(e.message)}</div>`}}
function render(){document.querySelectorAll('.view button').forEach(b=>b.classList.toggle('on',b.dataset.mode===S.mode));help.textContent=S.mode==='today'?'左右スワイプで前後へ。判定は端末とGitHubの両方に残せます。':'5/10営業日後、10営業日内の最大上昇/最大下落、A/B別勝率を自動計算します。';return S.mode==='today'?today():history()}
async function today(){if(!S.filtered.length){root.innerHTML='<div class="empty">この条件の銘柄はありません</div>';return}let x=S.filtered[S.i],sg=slabel(x),r=rate(x.code);root.innerHTML=`<section class="card"><div class="head"><div><div class="code">${esc(x.code)}</div><div class="name">${esc(x.name||x.code)}</div>${sg?`<span class="sig">${esc(sg)}</span>`:''}</div><div><div class="count">${S.i+1} / ${S.filtered.length}</div><div class="close">${fmt(x.close)}円</div><div id="chg" class="chg">—</div></div></div><div class="stats"><div class="stat"><div class="k">MA5</div><div id="m5" class="v">—</div></div><div class="stat"><div class="k">MA25</div><div id="m25" class="v">—</div></div><div class="stat"><div class="k">MA5/25乖離</div><div class="v">${pct(x.ma5_vs_ma25_pct)}</div></div><div class="stat"><div class="k">出来高比</div><div class="v">${x.volume_ratio!=null?fmt(x.volume_ratio,2)+'倍':'—'}</div></div></div><div class="ct"><div class="legend">ローソク / MA5 / MA25</div><div class="ranges"><button class="range ${S.range==='1m'?'on':''}" data-r="1m">1M</button><button class="range ${S.range==='3m'?'on':''}" data-r="3m">3M</button><button class="range ${S.range==='6m'?'on':''}" data-r="6m">6M</button></div></div><div id="chart"></div><div class="judge"><button class="sa" data-rate="A">A${r==='A'?' ✓':''}</button><button class="sb" data-rate="B">B${r==='B'?' ✓':''}</button><button class="ss" data-rate="skip">見送り${r==='skip'?' ✓':''}</button></div><div class="nav"><button id="prev">← 前</button><button id="next">次 →</button></div><div class="links"><a href="https://finance.yahoo.co.jp/quote/${encodeURIComponent(x.code)}.T" target="_blank">Yahoo!ファイナンス</a><a href="https://kabutan.jp/stock/chart?code=${encodeURIComponent(x.code)}" target="_blank">株探チャート</a></div></section>`;document.querySelectorAll('.range').forEach(b=>b.onclick=()=>{S.range=b.dataset.r;today()});document.querySelectorAll('[data-rate]').forEach(b=>b.onclick=()=>setRate(x,b.dataset.rate));prev.onclick=()=>{S.i=(S.i-1+S.filtered.length)%S.filtered.length;today()};next.onclick=()=>{S.i=(S.i+1)%S.filtered.length;today()};try{let p=await price(x.code),bars=p.bars||p;let n=S.range==='1m'?25:S.range==='3m'?65:130,b=bars.slice(-n),xs=b.map(z=>z.t),o=b.map(z=>+z.o),h=b.map(z=>+z.h),l=b.map(z=>+z.l),c=b.map(z=>+z.c),m5a=ma(c,5),m25a=ma(c,25),tk=xticks(xs);let prevc=c.length>1?c[c.length-2]:null,ch=prevc?(c.at(-1)/prevc-1)*100:null;chg.textContent=ch==null?'—':pct(ch);chg.className='chg '+(ch>=0?'up':'down');m5.textContent=m5a.at(-1)==null?'—':fmt(m5a.at(-1),1);m25.textContent=m25a.at(-1)==null?'—':fmt(m25a.at(-1),1);Plotly.newPlot('chart',[{x:xs,open:o,high:h,low:l,close:c,type:'candlestick',increasing:{line:{color:'#ff5d6c'}},decreasing:{line:{color:'#4d8cff'}},name:'株価'},{x:xs,y:m5a,type:'scatter',mode:'lines',line:{width:1.5,color:'#f2b134'},name:'MA5'},{x:xs,y:m25a,type:'scatter',mode:'lines',line:{width:1.3,color:'#35d68c'},name:'MA25'}],{margin:{l:42,r:12,t:10,b:32},paper_bgcolor:'#121a2b',plot_bgcolor:'#121a2b',font:{color:'#cbd3e3',size:10},showlegend:false,dragmode:false,xaxis:{rangeslider:{visible:false},gridcolor:'#263252',tickfont:{size:9},fixedrange:true,...tk},yaxis:{gridcolor:'#263252',tickfont:{size:9},fixedrange:true}},{displayModeBar:false,responsive:true,staticPlot:true,scrollZoom:false,doubleClick:false})}catch(e){chart.innerHTML='<div class="err">チャート読込失敗</div>'}}
function history(){let h=loadH().sort((a,b)=>String(b.date).localeCompare(String(a.date)));let sync=unsynced();document.getElementById('filters').style.display='none';if(!h.length){root.innerHTML='<div class="empty">判定履歴はまだありません</div>';return}let groups={A:h.filter(x=>x.rating==='A'),B:h.filter(x=>x.rating==='B')};let cards=h.map(e=>{let m=S.metrics[e.id];return `<div class="hcard"><div class="hrow"><div><div class="code">${esc(e.date)} / ${esc(e.code)}</div><div class="hname">${esc(e.name||e.code)}</div></div><span class="badge badge-${esc(e.rating)}">${esc(rlabel(e.rating))}</span></div><div class="perf"><div class="pb"><div class="k">5日後</div><div class="v">${m?pct(m.r5):'—'}</div></div><div class="pb"><div class="k">10日後</div><div class="v">${m?pct(m.r10):'—'}</div></div><div class="pb"><div class="k">最大上昇</div><div class="v">${m?pct(m.maxUp):'—'}</div></div></div><div class="acts"><button class="chartbtn" data-hchart="${esc(e.id)}">チャート</button><button data-del="${esc(e.id)}">削除</button></div><div class="hchartwrap" id="wrap_${cid(e.id)}"><div class="hchartnote">判定日を含む前後の値動き</div><div class="hchart" id="hc_${cid(e.id)}"></div></div></div>`}).join('');root.innerHTML=`<div class="hh"><span>${h.length}件 / 未同期 ${sync.length}件</span><button class="sync" id="syncbtn">GitHubへ同期</button></div><div class="summary"><div class="sumtitle">A/B 勝率（10営業日後・成熟分）</div><div class="sumgrid"><div class="sumbox"><div class="k">A</div><div class="big" id="wa">—</div></div><div class="sumbox"><div class="k">B</div><div class="big" id="wb">—</div></div></div></div><div class="history">${cards}</div>`;syncbtn.onclick=syncIssue;document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{let hh=loadH().filter(x=>x.id!==b.dataset.del);saveH(hh);history()});document.querySelectorAll('[data-hchart]').forEach(b=>b.onclick=()=>toggleHChart(b.dataset.hchart));loadMetrics(h)}
async function loadMetrics(h){for(const e of h){if(S.metrics[e.id])continue;try{let p=await price(e.code),bars=p.bars||p;S.metrics[e.id]=calcMetric(e,bars)}catch{S.metrics[e.id]=null}}let hs=loadH();for(const [key,elid] of [['A','wa'],['B','wb']]){let arr=hs.filter(x=>x.rating===key).map(x=>S.metrics[x.id]).filter(m=>m&&m.mature),w=arr.filter(m=>m.win).length;document.getElementById(elid).textContent=arr.length?`${(w/arr.length*100).toFixed(0)}% (${w}/${arr.length})`:'—'}historyRefreshMetrics()}
function historyRefreshMetrics(){document.querySelectorAll('.hcard').forEach(()=>{})}
async function toggleHChart(k){let e=loadH().find(x=>x.id===k);if(!e)return;let wrap=document.getElementById('wrap_'+cid(k)),el=document.getElementById('hc_'+cid(k));if(wrap.classList.contains('open')){wrap.classList.remove('open');return}wrap.classList.add('open');try{let p=await price(e.code),bars=p.bars||p,idx=bars.findIndex(z=>String(z.t).slice(0,10)===e.date);if(idx<0)idx=Math.max(0,bars.length-40);let b=bars.slice(Math.max(0,idx-20),Math.min(bars.length,idx+16)),xs=b.map(z=>z.t),c=b.map(z=>+z.c),m5a=ma(c,5),m25a=ma(c,25),tk=xticks(xs);Plotly.newPlot(el,[{x:xs,open:b.map(z=>+z.o),high:b.map(z=>+z.h),low:b.map(z=>+z.l),close:c,type:'candlestick',increasing:{line:{color:'#ff5d6c'}},decreasing:{line:{color:'#4d8cff'}}},{x:xs,y:m5a,type:'scatter',mode:'lines',line:{width:1.3,color:'#f2b134'}},{x:xs,y:m25a,type:'scatter',mode:'lines',line:{width:1.2,color:'#35d68c'}}],{margin:{l:42,r:10,t:10,b:28},paper_bgcolor:'#101827',plot_bgcolor:'#101827',font:{color:'#cbd3e3',size:9},showlegend:false,dragmode:false,xaxis:{rangeslider:{visible:false},gridcolor:'#263252',fixedrange:true,...tk},yaxis:{gridcolor:'#263252',fixedrange:true}},{displayModeBar:false,responsive:true,staticPlot:true,scrollZoom:false,doubleClick:false})}catch{el.innerHTML='<div class="err">チャート読込失敗</div>'}}
document.querySelectorAll('.view button').forEach(b=>b.onclick=()=>{S.mode=b.dataset.mode;document.getElementById('filters').style.display=S.mode==='today'?'flex':'none';filter();render()});document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{S.f=b.dataset.f;filter();render()});let sx=0;document.addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});document.addEventListener('touchend',e=>{if(S.mode!=='today'||!S.filtered.length)return;let dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)<60)return;S.i=(S.i+(dx<0?1:-1)+S.filtered.length)%S.filtered.length;today()},{passive:true});load();
</script></body></html>
