<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>スクリーニング結果</title><script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script><style>
:root{--bg:#0a0f1c;--p:#121a2b;--p2:#182339;--line:#263252;--ink:#eef2fb;--dim:#8e98b2;--acc:#f2b134;--up:#ff5d6c;--down:#4d8cff;--a:#35d68c;--b:#f2b134;--skip:#8993ac}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow-x:hidden}body{max-width:720px;margin:auto;padding:max(14px,env(safe-area-inset-top)) 8px max(30px,env(safe-area-inset-bottom))}button{font:inherit}.top{display:flex;justify-content:space-between;align-items:flex-end;padding:8px 4px 12px}.eye{font:10px ui-monospace;color:var(--acc);letter-spacing:.13em}h1{font-size:20px;margin:3px 0 0}.meta{font-size:11px;color:var(--dim);text-align:right}.view{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 2px 10px}.view button,.chip{border:1px solid var(--line);background:var(--p);color:var(--dim);border-radius:12px;padding:10px}.view .on,.chip.on{border-color:var(--acc);color:var(--ink);background:rgba(242,177,52,.1)}.filters{display:flex;gap:7px;overflow:auto;padding:0 2px 10px;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}.chip{border-radius:999px;white-space:nowrap;padding:8px 12px;font-size:11px}.card,.hcard,.summary{background:linear-gradient(180deg,var(--p2),var(--p));border:1px solid var(--line);border-radius:18px;overflow:hidden}.head{display:flex;justify-content:space-between;gap:10px;padding:15px}.code{font:11px ui-monospace;color:var(--dim)}.name{font-size:20px;font-weight:850;margin-top:3px}.sig{display:inline-block;margin-top:6px;border:1px solid var(--line);border-radius:999px;padding:4px 8px;font-size:10px;color:var(--dim)}.count{font:12px ui-monospace;color:var(--dim);text-align:right}.close{font-size:20px;font-weight:900;text-align:right;white-space:nowrap}.chg{text-align:right;font-size:12px}.up{color:var(--up)}.down{color:var(--down)}.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:0 12px 10px}.stat{background:#091225;border:1px solid var(--line);border-radius:12px;padding:9px}.k{font-size:9px;color:var(--dim)}.v{font:12px ui-monospace;margin-top:2px}.ct{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:5px 12px 0}.legend{font-size:10px;color:var(--dim)}.ranges{display:flex;border:1px solid var(--line);border-radius:9px;padding:2px}.range{border:0;background:transparent;color:var(--dim);padding:6px 9px;border-radius:7px;font-size:10px}.range.on{background:var(--p2);color:var(--ink)}#chart{height:500px;width:100%}.judge{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:10px 12px}.judge button{border:1px solid var(--line);background:#0b1427;color:var(--ink);border-radius:12px;padding:12px;font-weight:850}.judge .sa{border-color:var(--a);color:var(--a)}.judge .sb{border-color:var(--b);color:var(--b)}.judge .ss{border-color:var(--skip);color:#c5ccda}.nav,.links{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 12px 10px}.nav button,.links a{border:1px solid var(--line);background:var(--p2);color:var(--ink);border-radius:10px;padding:10px;text-align:center;text-decoration:none;font-size:12px}.links a{color:var(--acc)}.hh{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:2px 2px 10px;color:var(--dim);font-size:11px}.sync{border:1px solid var(--acc);background:rgba(242,177,52,.1);color:var(--ink);border-radius:9px;padding:8px 10px}.summary{padding:12px;margin-bottom:10px}.sumtitle{font-size:12px;font-weight:800;margin-bottom:9px}.sumgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.sumbox{background:#091225;border:1px solid var(--line);border-radius:10px;padding:9px}.sumbox .big{font-size:18px;font-weight:900;margin-top:2px}.history{display:grid;gap:9px}.hcard{padding:12px}.hrow{display:flex;justify-content:space-between;gap:8px}.hname{font-size:16px;font-weight:800}.badge{border-radius:999px;padding:4px 8px;font-size:11px;font-weight:900}.badge-A{color:var(--a);border:1px solid var(--a)}.badge-B{color:var(--b);border:1px solid var(--b)}.badge-skip{color:#c5ccda;border:1px solid var(--skip)}.perf{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:9px}.pb{background:#091225;border:1px solid var(--line);border-radius:8px;padding:7px;min-width:0}.pb .v{font-size:11px}.metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:6px}.acts{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}.acts button{border:1px solid var(--line);background:var(--p2);color:var(--ink);border-radius:8px;padding:9px;text-align:center;font-size:10px}.acts .chartbtn{color:var(--acc)}.hchartwrap{display:none;margin-top:9px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#101827}.hchartwrap.open{display:block}.hchartnote{font-size:10px;color:var(--dim);padding:9px 10px 0}.hchart{height:430px;width:100%}.empty,.err{text-align:center;padding:48px 20px;color:var(--dim)}.help{text-align:center;color:var(--dim);font-size:10px;padding:12px 8px}.syncnote{font-size:10px;color:var(--dim);padding:0 2px 10px}@media(max-width:420px){#chart{height:530px}.hchart{height:450px}.perf{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style></head><body><div class="top"><div><div class="eye">SCREENING REVIEW</div><h1>スクリーニング結果</h1></div><div id="meta" class="meta">読込中…</div></div><div class="view"><button data-mode="today" class="on">今日の判定</button><button data-mode="history">判定履歴</button></div><div id="filters" class="filters"><button class="chip on" data-f="all">すべて</button><button class="chip" data-f="unrated">未判定</button><button class="chip" data-f="A">A</button><button class="chip" data-f="B">B</button><button class="chip" data-f="skip">見送り</button></div><div id="root"><div class="empty">読み込み中…</div></div><div id="help" class="help">左右スワイプで前後へ。判定は端末とGitHubの両方に残せます。</div><script>
const OWNER='screamdayo',REPO='stock-screening',HK='screening-judgement-history:v1';const S={data:null,items:[],filtered:[],i:0,f:'all',range:'3m',mode:'today',remote:[],px:{},metrics:{}};const date=()=>S.data?.generated_at?.slice(0,10)||new Date().toISOString().slice(0,10);const loadH=()=>{try{let v=JSON.parse(localStorage.getItem(HK)||'[]');return Array.isArray(v)?v:[]}catch{return[]}};const saveH=v=>localStorage.setItem(HK,JSON.stringify(v));const id=(d,c)=>`${d}:${c}`;const cur=c=>loadH().find(x=>x.id===id(date(),c));const rate=c=>cur(c)?.rating||'';const fmt=(n,d=0)=>n==null||isNaN(+n)?'—':(+n).toLocaleString('ja-JP',{maximumFractionDigits:d});const pct=n=>n==null||isNaN(+n)?'—':`${+n>=0?'+':''}${(+n).toFixed(2)}%`;const vol=n=>n==null||isNaN(+n)?'—':+n>=1e8?`${(+n/1e8).toFixed(1)}億`:+n>=1e4?`${(+n/1e4).toFixed(0)}万`:(+n).toLocaleString('ja-JP');const ma=(a,n)=>a.map((_,i)=>i<n-1?null:a.slice(i-n+1,i+1).reduce((x,y)=>x+y,0)/n);const rlabel=x=>x==='skip'?'見送り':x;const slabel=x=>x.signal_label||(x.signal_type==='bottom_reversal'?'大底反転':x.signal_type==='pullback_reacceleration'?'押し目再上昇':'');const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const cid=s=>String(s).replace(/[^a-zA-Z0-9_-]/g,'_');const xticks=(xs,max=6)=>{let cross=new Set(xs.map(x=>String(x).slice(0,4))).size>1,step=Math.max(1,Math.ceil((xs.length-1)/Math.max(1,max-1))),v=[];for(let i=0;i<xs.length;i+=step)v.push(xs[i]);if(xs.length&&v.at(-1)!==xs.at(-1))v.push(xs.at(-1));return{tickmode:'array',tickvals:v,ticktext:v.map(x=>cross?String(x).slice(0,10):String(x).slice(5,10))}};
function mergeRemote(){let l=loadH(),m=new Map(l.map(x=>[x.id,x]));for(const x of S.remote||[])if(x&&x.id&&!m.has(x.id))m.set(x.id,x);saveH([...m.values()])}
function setRate(item,v){let h=loadH(),k=id(date(),item.code),i=h.findIndex(x=>x.id===k);if(i>=0&&h[i].rating===v)h.splice(i,1);else{let e={id:k,date:date(),code:item.code,name:item.name||item.code,rating:v,close:Number(item.close)||null,signal_type:item.signal_type||'',signal_label:item.signal_label||'',judged_at:new Date().toISOString()};if(i>=0)h[i]=e;else h.push(e)}saveH(h);filter(false);render()}
function unsynced(){let rm=new Set((S.remote||[]).map(x=>x.id+':'+x.rating));return loadH().filter(x=>!rm.has(x.id+':'+x.rating))}
function syncIssue(){let u=unsynced();if(!u.length){alert('未同期の履歴はありません');return}let compact=u.map(x=>({id:x.id,date:x.date,code:x.code,name:x.name,rating:x.rating,close:x.close,signal_type:x.signal_type,signal_label:x.signal_label,judged_at:x.judged_at}));let body='SCREENING_HISTORY_JSON\n```json\n'+JSON.stringify(compact)+'\n```';let url=`https://github.com/${OWNER}/${REPO}/issues/new?title=${encodeURIComponent('[screening-history-sync] '+date())}&body=${encodeURIComponent(body)}`;window.open(url,'_blank')}
function filter(reset=true){if(S.mode==='today'){S.filtered=S.items.filter(x=>{let v=rate(x.code);return S.f==='all'||(S.f==='unrated'&&!v)||v===S.f});if(reset)S.i=0;if(S.i>=S.filtered.length)S.i=Math.max(0,S.filtered.length-1)}document.querySelectorAll('.chip').forEach(b=>b.classList.toggle('on',b.dataset.f===S.f))}
async function price(code){if(S.px[code])return S.px[code];let r=await fetch(`prices/${code}.json?v=${Date.now()}`,{cache:'no-store'});if(!r.ok)throw Error('price');return S.px[code]=await r.json()}
function calcMetric(e,b){let base=+e.close;if(!base)return null;let i=b.findIndex(z=>String(z.t).slice(0,10)===e.date);if(i<0)i=b.findIndex(z=>String(z.t).slice(0,10)>e.date)-1;if(i<0)return null;let after=b.slice(i+1),d5=after[4],d10=after[9],win=after.slice(0,10),high=win.length?Math.max(...win.map(z=>+z.h)):null,low=win.length?Math.min(...win.map(z=>+z.l)):null;return{r5:d5?(+d5.c/base-1)*100:null,r10:d10?(+d10.c/base-1)*100:null,maxUp:high!=null?(high/base-1)*100:null,maxDown:low!=null?(low/base-1)*100:null,mature:!!d10,win:d10?+d10.c>base:null}}
async function load(){try{let [a,b]=await Promise.all([fetch(`screening.json?v=${Date.now()}`,{cache:'no-store'}),fetch(`judgement_history.json?v=${Date.now()}`,{cache:'no-store'}).catch(()=>null)]);if(!a.ok)throw Error(`screening.json ${a.status}`);S.data=await a.json();S.items=S.data.items||[];if(S.items.length>=5){S.items.sort((x,y)=>Math.abs(x?.ma5_vs_ma25_pct??Infinity)-Math.abs(y?.ma5_vs_ma25_pct??Infinity))}if(b&&b.ok)S.remote=await b.json();mergeRemote();filter();let d=new Date(S.data.generated_at);meta.innerHTML=`${S.data.count}件<br>${d.toLocaleString('ja-JP')}`;render()}catch(e){root.innerHTML=`<div class="err">読み込み失敗<br>${esc(e.message)}</div>`}}
function render(){document.querySelectorAll('.view button').forEach(b=>b.classList.toggle('on',b.dataset.mode===S.mode));help.textContent=S.mode==='today'?'左右スワイプで前後へ。判定は端末とGitHubの両方に残せます。':'5/10営業日後、10営業日内の最大上昇/最大下落、A/B別勝率を自動計算します。';return S.mode==='today'?today():history()}
</script></body></html>
