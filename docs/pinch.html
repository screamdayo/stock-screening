<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ピンチをチャンスにセンサー</title>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root{--a:#163b3f;--b:#260b29;--c:#fff6c9;--d:#74d9d7;--e:#ff5d6c;--p:#7e36bf}
*{box-sizing:border-box}html{min-height:100%;background:conic-gradient(#d7efe4 0 25%,#c6dfd5 25% 50%,#d7efe4 50% 75%,#c6dfd5 75%) 0 0/64px 64px}
body{max-width:760px;margin:auto;padding:18px 10px 40px;font-family:"DotGothic16",monospace;color:var(--c)}
.box{background:linear-gradient(#32113a,var(--b));border:4px solid var(--d);box-shadow:0 0 0 2px var(--a),0 0 0 5px #8fb7aa,7px 7px 0 #0004;margin:7px 5px 16px;padding:16px;position:relative}
h1{font-size:23px;margin:4px 0 8px}.sub{font-size:11px;color:#d9c7c9}.status{font-size:28px;margin:14px 0}.on{color:var(--e)}.off{color:#9df0c5}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.cell{border:2px solid #4a706f;background:#32113a;padding:10px}.k{font-size:10px;color:var(--d)}.v{font-size:17px;margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:11px}th,td{padding:8px;border-bottom:1px solid #4a706f;text-align:right}th:first-child,td:first-child{text-align:left}
a{color:var(--d)}.nav{text-align:center;font-size:11px}.empty{padding:18px;text-align:center;color:#d9c7c9}
@media(max-width:430px){.grid{grid-template-columns:1fr 1fr}h1{font-size:20px}.status{font-size:23px}}
</style></head><body>
<div class="box"><div class="sub">MARKET CRASH BOTTOM SENSOR</div><h1>🚨 ピンチをチャンスにセンサー</h1><div id="meta" class="sub">読込中…</div><div id="status" class="status">—</div>
<div class="grid"><div class="cell"><div class="k">市場反転率</div><div id="rate" class="v">—</div></div><div class="cell"><div class="k">TOPIX 当日</div><div id="ret" class="v">—</div></div><div class="cell"><div class="k">TOPIX 安値切り上げ</div><div id="low" class="v">—</div></div><div class="cell"><div class="k">出口目安</div><div id="exit" class="v">15営業日</div></div></div></div>
<div class="box"><div class="sub">CANDIDATES</div><h1>個別候補</h1><div id="cand" class="empty">読込中…</div></div>
<div class="box nav"><a href="screening.html">← くいっと</a>　/　<a href="gc.html">GC強ブレイク</a></div>
<script>
const f=(n,d=2)=>n==null?'—':Number(n).toFixed(d);async function load(){try{let r=await fetch('pinch_sensor.json?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(r.status);let x=await r.json();meta.textContent=(x.signal_date||'').slice(0,10)+' / '+(x.generated_at||'').replace('T',' ').slice(0,19);status.textContent=x.active?'発動中':'待機中';status.className='status '+(x.active?'on':'off');rate.textContent=f(x.reversal_rate_pct,3)+'%  ('+(x.coarse_reversal_count??0)+'/'+(x.universe_n??0)+')';ret.textContent=(x.topix_return_pct>=0?'+':'')+f(x.topix_return_pct,3)+'%';low.textContent=x.topix_low_up?'YES':'NO';exit.textContent=(x.exit_guide_business_days||15)+'営業日';let a=x.candidates||[];if(!x.active){cand.innerHTML='<div class="empty">市場センサー未発動。候補抽出は停止中。</div>';return}if(!a.length){cand.innerHTML='<div class="empty">市場センサーは発動したが個別候補なし。</div>';return}cand.className='';cand.innerHTML='<table><thead><tr><th>銘柄</th><th>5日</th><th>DD20</th><th>陽線</th><th>出来高</th></tr></thead><tbody>'+a.map(z=>'<tr><td>'+z.name+' ('+z.code+')</td><td>'+f(z.ret5_pct)+'%</td><td>'+f(z.dd20_pct)+'%</td><td>+'+f(z.bull_candle_pct)+'%</td><td>'+f(z.volume_ratio20)+'x</td></tr>').join('')+'</tbody></table>'}catch(e){status.textContent='読込失敗';cand.textContent=e.message}}load();
</script></body></html>
