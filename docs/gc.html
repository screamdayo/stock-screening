<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GC強ブレイク</title>
<script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=DotGothic16&display=swap');
:root{--bg1:#72d98e;--bg2:#69afd0;--panel:#260b29;--panel2:#321036;--panel3:#1c071f;--frame:#83e7b7;--frame2:#d9f7bd;--line:#74d9d7;--ink:#fff6c9;--dim:#b9d5c8;--acc:#ffd966;--warn:#ffcb6b}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:12px 10px 32px;font-family:'DotGothic16',monospace;color:var(--ink);background-color:var(--bg1);background-image:linear-gradient(45deg,var(--bg2) 25%,transparent 25%),linear-gradient(-45deg,var(--bg2) 25%,transparent 25%),linear-gradient(45deg,transparent 75%,var(--bg2) 75%),linear-gradient(-45deg,transparent 75%,var(--bg2) 75%);background-size:34px 34px;background-position:0 0,0 17px,17px -17px,-17px 0}
.top,.card,.empty{max-width:920px;margin:0 auto 16px;background:var(--panel);border:4px solid var(--frame);box-shadow:0 0 0 2px #163b3f,0 0 0 5px var(--frame2)}
.top{padding:14px 16px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.eye{font-size:10px;color:var(--acc);letter-spacing:2px}.title{font-size:23px;margin:3px 0}.meta{font-size:10px;text-align:right;color:var(--dim)}
.links{max-width:920px;margin:0 auto 16px;display:flex;gap:8px}.links a{flex:1;text-align:center;text-decoration:none;color:var(--ink);background:var(--panel);border:3px solid var(--frame);padding:9px}
.card{padding:15px}.head{display:flex;justify-content:space-between;gap:12px}.code{font-size:11px;color:var(--acc)}.name{font-size:20px}.close{font-size:18px;text-align:right}.badge{display:inline-block;margin-top:7px;padding:4px 8px;border:2px solid var(--line);color:var(--acc)}
.warn{margin-top:8px;padding:8px;border:2px solid var(--warn);color:var(--warn);font-size:11px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:13px}.stat{background:var(--panel2);border:2px solid var(--line);padding:8px}.k{font-size:9px;color:var(--dim)}.v{font-size:14px;margin-top:4px}
.note{margin:12px 0 4px;padding:9px;background:var(--panel3);border-left:4px solid var(--acc);font-size:11px;line-height:1.7}
.chart{height:430px;margin-top:10px;background:var(--panel3);border:2px solid var(--line)}
.empty{padding:50px 20px;text-align:center}.small{font-size:10px;color:var(--dim);margin-top:8px}
@media(max-width:520px){.title{font-size:20px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.chart{height:380px}}
</style>
</head>
<body>
<div class="top"><div><div class="eye">RARE SIGNAL WATCH</div><div class="title">GC強ブレイク</div><div class="small">深い下落後のGC2回目＋強い上抜け</div></div><div id="meta" class="meta">読込中…</div></div>
<div class="links"><a href="screening.html">くいっと</a><a href="holdings.html">保有銘柄</a></div>
<div id="root"><div class="empty">読み込み中…</div></div>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const fmt=(n,d=2)=>n==null||isNaN(+n)?'—':(+n).toLocaleString('ja-JP',{maximumFractionDigits:d});
const pct=n=>n==null||isNaN(+n)?'—':`${+n>=0?'+':''}${(+n).toFixed(2)}%`;
const ma=(a,n)=>a.map((_,i)=>i<n-1?null:a.slice(i-n+1,i+1).reduce((x,y)=>x+y,0)/n);
async function price(code){let r=await fetch(`prices/${code}.json?v=${Date.now()}`,{cache:'no-store'});if(!r.ok)throw Error('price');return r.json()}
async function load(){
  try{
    const r=await fetch(`gc_screening.json?v=${Date.now()}`,{cache:'no-store'});if(!r.ok)throw Error('gc_screening.json '+r.status);
    const d=await r.json(); const items=d.items||[];
    const dt=new Date(d.generated_at);document.getElementById('meta').innerHTML=`${items.length}件<br>${dt.toLocaleString('ja-JP')}`;
    if(!items.length){root.innerHTML='<div class="empty">本日のGC強ブレイクはありません<div class="small">年数件レベルなので、出たらラッキーくらいの別枠監視です。</div></div>';return}
    root.innerHTML=items.map((x,i)=>`<section class="card"><div class="head"><div><div class="code">${esc(x.code)}</div><div class="name">${esc(x.name||x.code)}</div><span class="badge">GC強ブレイク</span>${x.earnings_within_10bd?`<div class="warn">⚠️ 10営業日以内に決算あり<br>${esc(x.earnings_date||'')} ${x.earnings_business_days!=null?`（${fmt(x.earnings_business_days,0)}営業日後）`:''}</div>`:''}</div><div><div class="close">${fmt(x.close,1)}円</div></div></div><div class="stats"><div class="stat"><div class="k">DD60</div><div class="v">${pct(x.dd60_pct)}</div></div><div class="stat"><div class="k">MA25 5日傾き</div><div class="v">${pct(x.ma25_slope5_pct)}</div></div><div class="stat"><div class="k">GC乖離</div><div class="v">${pct(x.gc_gap_pct)}</div></div><div class="stat"><div class="k">出来高 / 20日平均</div><div class="v">${fmt(x.volume_ratio20,2)}倍</div></div><div class="stat"><div class="k">当日陽線</div><div class="v">${pct(x.bull_candle_pct)}</div></div><div class="stat"><div class="k">GC回数</div><div class="v">${fmt(x.gc_sequence,0)}回目</div></div></div><div class="note">検証では9〜10営業日付近に成績の山。決算ありは除外せず警告表示だけ。</div><div class="chart" id="chart_${i}"></div></section>`).join('');
    for(let i=0;i<items.length;i++){draw(items[i],i)}
  }catch(e){root.innerHTML=`<div class="empty">読み込み失敗<br>${esc(e.message)}</div>`}
}
async function draw(x,i){
 try{
  let p=await price(x.code),bars=p.bars||p,b=bars.slice(-90),xs=b.map(z=>z.t),c=b.map(z=>+z.c),m5=ma(c,5),m25=ma(c,25);
  Plotly.newPlot('chart_'+i,[{x:xs,open:b.map(z=>+z.o),high:b.map(z=>+z.h),low:b.map(z=>+z.l),close:c,type:'candlestick',increasing:{line:{color:'#ff5d6c'}},decreasing:{line:{color:'#4d8cff'}},name:'株価'},{x:xs,y:m5,type:'scatter',mode:'lines',line:{width:1.4,color:'#f2b134'},name:'MA5'},{x:xs,y:m25,type:'scatter',mode:'lines',line:{width:1.3,color:'#35d68c'},name:'MA25'}],{margin:{l:42,r:10,t:12,b:28},paper_bgcolor:'#260b29',plot_bgcolor:'#260b29',font:{color:'#fff6c9',size:9},showlegend:false,dragmode:false,xaxis:{rangeslider:{visible:false},gridcolor:'#4a706f',fixedrange:true},yaxis:{gridcolor:'#4a706f',fixedrange:true}},{displayModeBar:false,responsive:true,staticPlot:true})
 }catch{document.getElementById('chart_'+i).innerHTML='<div class="empty">チャート読込失敗</div>'}
}
load();
</script>
</body>
</html>
