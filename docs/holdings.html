<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>保有銘柄管理</title>
<style>
:root{--bg:#0a0f1c;--panel:#121a2b;--panel2:#182339;--line:#263252;--ink:#eef2fb;--dim:#8e98b2;--acc:#f2b134;--ok:#35d68c;--danger:#ff5d6c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{max-width:720px;margin:auto;padding:max(16px,env(safe-area-inset-top)) 12px max(28px,env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:14px}.eyebrow{font-size:10px;color:var(--acc);letter-spacing:.14em}.title{font-size:24px;font-weight:900;margin-top:3px}.back{color:var(--acc);text-decoration:none;font-size:12px}.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}.card h2{font-size:16px;margin:0 0 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:11px;color:var(--dim)}input{width:100%;border:1px solid var(--line);background:#0b1427;color:var(--ink);border-radius:12px;padding:13px 12px;font:inherit;font-size:16px;outline:none}input:focus{border-color:var(--acc)}button{width:100%;border:0;border-radius:13px;padding:14px;font:inherit;font-weight:900;cursor:pointer}.primary{background:var(--acc);color:#111827;margin-top:12px}.note{font-size:11px;color:var(--dim);line-height:1.55;margin-top:10px}.section-title{display:flex;justify-content:space-between;align-items:center;margin:18px 2px 10px}.section-title h2{font-size:15px;margin:0}.count{font-size:11px;color:var(--dim)}.holding{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:9px}.row{display:flex;justify-content:space-between;gap:12px}.code{font-size:11px;color:var(--dim)}.name{font-size:18px;font-weight:850;margin-top:2px}.meta{font-size:12px;color:var(--dim);margin-top:8px;line-height:1.7}.remove{margin-top:10px;background:transparent;color:var(--danger);border:1px solid rgba(255,93,108,.55)}.empty,.err{text-align:center;color:var(--dim);padding:28px 10px}.foot{text-align:center;color:var(--dim);font-size:10px;padding:10px 4px}.pill{display:inline-block;border:1px solid var(--ok);color:var(--ok);border-radius:999px;padding:4px 8px;font-size:10px;font-weight:800}
@media(max-width:480px){.grid{grid-template-columns:1fr}.field.full{grid-column:auto}}
</style>
</head>
<body>
<div class="top"><div><div class="eyebrow">HOLDING MANAGER</div><div class="title">保有銘柄管理</div></div><a class="back" href="screening.html">← スクリーニング</a></div>

<section class="card">
<h2>＋ 保有を登録</h2>
<div class="grid">
  <div class="field"><label>銘柄コード</label><input id="code" inputmode="numeric" placeholder="例 7974" maxlength="6"></div>
  <div class="field"><label>買付日</label><input id="buyDate" type="date"></div>
  <div class="field"><label>買値</label><input id="buyPrice" inputmode="decimal" placeholder="例 8242"></div>
  <div class="field"><label>銘柄名</label><input id="name" placeholder="例 任天堂"></div>
</div>
<button class="primary" onclick="addHolding()">GitHubで保有登録する</button>
<div class="note">ボタンを押すと、入力済みのGitHub Issueが開きます。内容を確認して「Submit new issue」を押せば登録完了です。</div>
</section>

<div class="section-title"><h2>現在の保有監視</h2><div id="count" class="count">読込中…</div></div>
<div id="list"><div class="empty">読み込み中…</div></div>
<div class="foot">厳しめがくっと / 最大15営業日を毎日16:00に自動監視</div>

<script>
const OWNER='screamdayo',REPO='stock-screening';
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const fmt=n=>n==null||n===''||isNaN(+n)?'—':(+n).toLocaleString('ja-JP');
const todayJst=()=>{const d=new Date(Date.now()+9*60*60*1000);return d.toISOString().slice(0,10)};
document.getElementById('buyDate').value=todayJst();

function issueUrl(title,body=''){
  return `https://github.com/${OWNER}/${REPO}/issues/new?title=${encodeURIComponent(title)}&body=${encodeURIComponent(body)}`;
}
function addHolding(){
  const code=document.getElementById('code').value.trim();
  const buyDate=document.getElementById('buyDate').value;
  const buyPrice=document.getElementById('buyPrice').value.trim().replace(/,/g,'');
  const name=document.getElementById('name').value.trim();
  if(!/^\d{4,6}$/.test(code)){alert('銘柄コードを4〜6桁で入力してください');return}
  if(!/^\d{4}-\d{2}-\d{2}$/.test(buyDate)){alert('買付日を入力してください');return}
  if(buyPrice && !/^\d+(\.\d+)?$/.test(buyPrice)){alert('買値を数字で入力してください');return}
  let title=`[holding-add] ${code} ${buyDate}`;
  if(buyPrice) title+=` ${buyPrice}`;
  if(name) title+=` ${name}`;
  const body='GitHub Pagesの保有銘柄管理画面から登録';
  window.open(issueUrl(title,body),'_blank');
}
function removeHolding(code,name){
  if(!confirm(`${name||code} を保有監視から外しますか？`))return;
  window.open(issueUrl(`[holding-remove] ${code}`,'GitHub Pagesの保有銘柄管理画面から削除'),'_blank');
}
async function load(){
  try{
    const r=await fetch(`holdings.json?v=${Date.now()}`,{cache:'no-store'});
    if(!r.ok) throw new Error(`holdings.json ${r.status}`);
    const rows=await r.json();
    document.getElementById('count').textContent=`${rows.length}銘柄`;
    if(!rows.length){document.getElementById('list').innerHTML='<div class="empty">現在、保有監視中の銘柄はありません</div>';return}
    document.getElementById('list').innerHTML=rows.map(x=>`<section class="holding"><div class="row"><div><div class="code">${esc(x.code)}</div><div class="name">${esc(x.name||x.code)}</div></div><span class="pill">監視中</span></div><div class="meta">買付日：${esc(x.buy_date||'—')}<br>買値：${x.buy_price!=null?fmt(x.buy_price)+'円':'—'}</div><button class="remove" onclick="removeHolding('${esc(x.code)}','${esc(x.name||x.code)}')">売却済みにする</button></section>`).join('');
  }catch(e){document.getElementById('count').textContent='—';document.getElementById('list').innerHTML=`<div class="err">保有一覧の読み込みに失敗しました<br>${esc(e.message)}</div>`}
}
load();
</script>
</body>
</html>
