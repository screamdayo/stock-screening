<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>保有銘柄管理</title>
<style>
:root{--bg:#0a0f1c;--panel:#121a2b;--panel2:#182339;--line:#263252;--ink:#eef2fb;--dim:#8e98b2;--acc:#f2b134;--ok:#35d68c;--danger:#ff5d6c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{max-width:720px;margin:auto;padding:max(16px,env(safe-area-inset-top)) 12px max(28px,env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:14px}.eyebrow{font-size:10px;color:var(--acc);letter-spacing:.14em}.title{font-size:24px;font-weight:900;margin-top:3px}.back{color:var(--acc);text-decoration:none;font-size:12px}.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}.card h2{font-size:16px;margin:0 0 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:6px;position:relative}.field.full{grid-column:1/-1}.field label{font-size:11px;color:var(--dim)}input{width:100%;border:1px solid var(--line);background:#0b1427;color:var(--ink);border-radius:12px;padding:13px 12px;font:inherit;font-size:16px;outline:none}input:focus{border-color:var(--acc)}button{width:100%;border:0;border-radius:13px;padding:14px;font:inherit;font-weight:900;cursor:pointer}.primary{background:var(--acc);color:#111827;margin-top:12px}.note{font-size:11px;color:var(--dim);line-height:1.55;margin-top:10px}.lookup{font-size:10px;min-height:14px;color:var(--dim)}.lookup.ok{color:var(--ok)}.lookup.ng{color:var(--danger)}.suggestions{position:absolute;left:0;right:0;top:76px;background:#0b1427;border:1px solid var(--line);border-radius:12px;overflow:hidden;z-index:20;box-shadow:0 12px 30px rgba(0,0,0,.35);display:none}.suggestions.open{display:block}.suggestion{padding:11px 12px;border-bottom:1px solid var(--line);cursor:pointer}.suggestion:last-child{border-bottom:0}.suggestion:hover{background:var(--panel2)}.suggestion .sname{font-weight:800}.suggestion .scode{font-size:11px;color:var(--dim);margin-top:2px}.section-title{display:flex;justify-content:space-between;align-items:center;margin:18px 2px 10px}.section-title h2{font-size:15px;margin:0}.count{font-size:11px;color:var(--dim)}.holding{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:9px}.row{display:flex;justify-content:space-between;gap:12px}.code{font-size:11px;color:var(--dim)}.name{font-size:18px;font-weight:850;margin-top:2px}.meta{font-size:12px;color:var(--dim);margin-top:8px;line-height:1.7}.remove{margin-top:10px;background:transparent;color:var(--danger);border:1px solid rgba(255,93,108,.55)}.empty,.err{text-align:center;color:var(--dim);padding:28px 10px}.foot{text-align:center;color:var(--dim);font-size:10px;padding:10px 4px}.pill{display:inline-block;border:1px solid var(--ok);color:var(--ok);border-radius:999px;padding:4px 8px;font-size:10px;font-weight:800}
@media(max-width:480px){.grid{grid-template-columns:1fr}.field.full{grid-column:auto}.suggestions{top:76px}}
</style>
</head>
<body>
<div class="top"><div><div class="eyebrow">HOLDING MANAGER</div><div class="title">保有銘柄管理</div></div><a class="back" href="screening.html">← スクリーニング</a></div>

<section class="card">
<h2>＋ 保有を登録</h2>
<div class="grid">
  <div class="field"><label>銘柄コード</label><input id="code" autocapitalize="characters" placeholder="例 7974 / 123A" maxlength="6"><div id="lookup" class="lookup">コードを入れると銘柄名を自動表示</div></div>
  <div class="field"><label>買付日</label><input id="buyDate" type="date"></div>
  <div class="field"><label>買値</label><input id="buyPrice" inputmode="decimal" placeholder="例 8242"></div>
  <div class="field"><label>銘柄名</label><input id="name" placeholder="例 任天堂"><div id="nameSuggestions" class="suggestions"></div></div>
</div>
<button class="primary" onclick="addHolding()">GitHubで保有登録する</button>
<div class="note">コード→銘柄名、銘柄名→コードの両方向で検索できます。銘柄名は一部入力すると候補が出るので、選ぶとコードも自動で入ります。</div>
</section>

<div class="section-title"><h2>現在の保有監視</h2><div id="count" class="count">読込中…</div></div>
<div id="list"><div class="empty">読み込み中…</div></div>
<div class="foot">厳しめがくっと / 最大15営業日を毎日16:00に自動監視</div>

<script>
const OWNER='screamdayo',REPO='stock-screening';
let STOCK_NAMES={},NAME_ROWS=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const fmt=n=>n==null||n===''||isNaN(+n)?'—':(+n).toLocaleString('ja-JP');
const todayJst=()=>{const d=new Date(Date.now()+9*60*60*1000);return d.toISOString().slice(0,10)};
document.getElementById('buyDate').value=todayJst();
function issueUrl(title,body=''){return `https://github.com/${OWNER}/${REPO}/issues/new?title=${encodeURIComponent(title)}&body=${encodeURIComponent(body)}`}
function normCode(v){return String(v||'').toUpperCase().replace(/[^0-9A-Z]/g,'').slice(0,6)}
function normName(v){return String(v||'').toLowerCase().replace(/[\s　・･()（）]/g,'')}
function chooseStock(code,name){document.getElementById('code').value=code;document.getElementById('name').value=name;document.getElementById('nameSuggestions').classList.remove('open');const msg=document.getElementById('lookup');msg.textContent=`✓ ${name}`;msg.className='lookup ok'}
function lookupCode(){const input=document.getElementById('code'),code=normCode(input.value);if(input.value!==code)input.value=code;const name=STOCK_NAMES[code]||'';const nameInput=document.getElementById('name'),msg=document.getElementById('lookup');msg.className='lookup';if(!code){msg.textContent='コードを入れると銘柄名を自動表示';return}if(name){nameInput.value=name;msg.textContent=`✓ ${name}`;msg.classList.add('ok');return}msg.textContent='該当銘柄が見つかりません';msg.classList.add('ng')}
function lookupByName(){const q=document.getElementById('name').value.trim(),box=document.getElementById('nameSuggestions');box.innerHTML='';box.classList.remove('open');if(!q||q.length<1)return;const nq=normName(q);let matches=NAME_ROWS.filter(x=>normName(x.name).includes(nq)).slice(0,8);if(!matches.length)return;box.innerHTML=matches.map(x=>`<div class="suggestion" data-code="${esc(x.code)}" data-name="${esc(x.name)}"><div class="sname">${esc(x.name)}</div><div class="scode">${esc(x.code)}</div></div>`).join('');box.querySelectorAll('.suggestion').forEach(el=>el.addEventListener('click',()=>chooseStock(el.dataset.code,el.dataset.name)));box.classList.add('open')}
async function loadStockNames(){try{const r=await fetch(`stock_names.json?v=${Date.now()}`,{cache:'no-store'});if(!r.ok)throw new Error('stock_names');const data=await r.json();STOCK_NAMES=data.items||{};NAME_ROWS=Object.entries(STOCK_NAMES).map(([code,name])=>({code,name}));lookupCode()}catch{const msg=document.getElementById('lookup');msg.textContent='銘柄名一覧を取得できません';msg.className='lookup ng'}}
document.getElementById('code').addEventListener('input',lookupCode);document.getElementById('name').addEventListener('input',lookupByName);document.addEventListener('click',e=>{if(!e.target.closest('#name')&&!e.target.closest('#nameSuggestions'))document.getElementById('nameSuggestions').classList.remove('open')});
function addHolding(){const code=normCode(document.getElementById('code').value);const buyDate=document.getElementById('buyDate').value;const buyPrice=document.getElementById('buyPrice').value.trim().replace(/,/g,'');const name=document.getElementById('name').value.trim();if(!/^[0-9A-Z]{4,6}$/.test(code)){alert('銘柄コードを英数字4〜6文字で入力してください');return}if(!name){alert('銘柄名を確認してください');return}if(!/^\d{4}-\d{2}-\d{2}$/.test(buyDate)){alert('買付日を入力してください');return}if(buyPrice&&!/^\d+(\.\d+)?$/.test(buyPrice)){alert('買値を数字で入力してください');return}let title=`[holding-add] ${code} ${buyDate}`;if(buyPrice)title+=` ${buyPrice}`;title+=` ${name}`;window.open(issueUrl(title,'GitHub Pagesの保有銘柄管理画面から登録'),'_blank')}
function removeHolding(code,name){if(!confirm(`${name||code} を保有監視から外しますか？`))return;window.open(issueUrl(`[holding-remove] ${code}`,'GitHub Pagesの保有銘柄管理画面から削除'),'_blank')}
async function load(){try{const r=await fetch(`holdings.json?v=${Date.now()}`,{cache:'no-store'});if(!r.ok)throw new Error(`holdings.json ${r.status}`);const rows=await r.json();document.getElementById('count').textContent=`${rows.length}銘柄`;if(!rows.length){document.getElementById('list').innerHTML='<div class="empty">現在、保有監視中の銘柄はありません</div>';return}document.getElementById('list').innerHTML=rows.map(x=>`<section class="holding"><div class="row"><div><div class="code">${esc(x.code)}</div><div class="name">${esc(x.name||x.code)}</div></div><span class="pill">監視中</span></div><div class="meta">買付日：${esc(x.buy_date||'—')}<br>買値：${x.buy_price!=null?fmt(x.buy_price)+'円':'—'}</div><button class="remove" onclick="removeHolding('${esc(x.code)}','${esc(x.name||x.code)}')">売却済みにする</button></section>`).join('')}catch(e){document.getElementById('count').textContent='—';document.getElementById('list').innerHTML=`<div class="err">保有一覧の読み込みに失敗しました<br>${esc(e.message)}</div>`}}
loadStockNames();load();
</script>
</body>
</html>
