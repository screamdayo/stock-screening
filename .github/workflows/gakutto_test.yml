name: Gakutto Test

on:
  push:
    branches:
      - gakutto-test
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gakutto-test

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore price cache
        uses: actions/cache/restore@v4
        with:
          path: data/
          key: backtest-price-cache-v1-gakutto-${{ github.run_id }}
          restore-keys: |
            backtest-price-cache-v1-

      - name: Run gakutto backtest
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
        run: python run_gakutto_test.py

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gakutto-output-${{ github.run_id }}
          path: output/
          retention-days: 14
          if-no-files-found: ignore
