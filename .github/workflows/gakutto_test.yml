name: Gakutto Test

on:
  push:
    branches:
      - gakutto-test
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gakutto-test

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas

      - name: Run recent gakutto backtest
        run: python run_gakutto_recent.py

      - name: Run kuitto reverse analysis
        run: python run_kuitto_reverse.py

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signal-analysis-output-${{ github.run_id }}
          path: output/
          retention-days: 14
          if-no-files-found: ignore
