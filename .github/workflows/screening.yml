name: Daily Screening

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1-5'  # 16:00 JST
  push:
    paths:
      - 'trigger/screening.txt'
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  screening:
    if: github.event_name != 'issues' || startsWith(github.event.issue.title, '[screening-trigger]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run screening
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python main.py

      - name: Commit generated docs
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          tmpdir="$(mktemp -d)"
          mkdir -p "$tmpdir/docs"
          if [ -d docs/prices ]; then
            cp -a docs/prices "$tmpdir/docs/prices"
          fi
          if [ -f docs/screening.json ]; then
            cp docs/screening.json "$tmpdir/docs/screening.json"
          fi

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main

            if [ -d "$tmpdir/docs/prices" ]; then
              rm -rf docs/prices
              mkdir -p docs
              cp -a "$tmpdir/docs/prices" docs/prices
            fi
            if [ -f "$tmpdir/docs/screening.json" ]; then
              mkdir -p docs
              cp "$tmpdir/docs/screening.json" docs/screening.json
            fi

            git add docs/prices/ docs/screening.json 2>/dev/null || true
            if git diff --cached --quiet; then
              echo "No generated docs changes to commit."
              exit 0
            fi

            git commit -m "Update screening data"
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push failed due to a concurrent update; retrying ($attempt/3)..."
            git reset --soft HEAD~1
          done

          echo "Failed to push after 3 attempts."
          exit 1

      - name: Close ChatGPT trigger issue
        if: always() && github.event_name == 'issues' && startsWith(github.event.issue.title, '[screening-trigger]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --comment "Daily Screening trigger processed."
