name: 株スクリーニング

on:
  schedule:
    - cron: '0 7 * * 1-5'  # UTC 7:00 = JST 16:00（平日のみ）
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ライブラリインストール
        run: pip install -r requirements.txt

      - name: スクリーニング実行（Discord通知 + GitHub Pages用データ出力）
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
        # 使用する戦略は config.py の ACTIVE_STRATEGY で切り替える
        # 株価取得・シグナル判定・Discord通知・docs/への出力を1回の実行でまとめて行う
        run: python main.py

      - name: GitHub Pages用データをcommit
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 生成済みdocsを一時退避してから、remote mainの最新状態へ乗せ直す。
          # 他のActionsや手動更新が先にmainへpushしていても、その変更を消さない。
          tar -czf /tmp/screening-docs.tar.gz docs/prices docs/screening.json

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            rm -rf docs/prices docs/screening.json
            tar -xzf /tmp/screening-docs.tar.gz

            git add docs/prices/ docs/screening.json
            if git diff --cached --quiet; then
              echo "変更なし"
              exit 0
            fi

            git commit -m "chore: docsデータを更新"
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "push競合。最新mainへ乗せ直して再試行します (${attempt}/3)"
          done

          echo "3回再試行してもpushできませんでした"
          exit 1
