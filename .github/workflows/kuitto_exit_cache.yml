name: Kuitto Exit Cache Backtest

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  backtest:
    if: github.event_name != 'issues' || startsWith(github.event.issue.title, '[kuitto-exit-cache]')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code and cached signals
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas pyarrow numpy

      - name: Run lightweight exit backtest
        run: python scripts/backtest_kuitto_exit_cache.py

      - name: Commit results
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/kuitto_exit_cache_summary.json
          if git diff --cached --quiet; then
            echo "No result changes."
          else
            git commit -m "Backtest Kuitto exits from cached signals"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Close trigger issue
        if: always() && github.event_name == 'issues' && startsWith(github.event.issue.title, '[kuitto-exit-cache]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --comment "Lightweight Kuitto exit backtest processed."
