name: Crash Market Bottom Confirmation
on:
  workflow_dispatch:
  push:
    paths: ['scripts/analyze_crash_market_bottom_confirmation.py']
permissions: {contents: write}
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install pandas requests
      - run: python scripts/analyze_crash_market_bottom_confirmation.py
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/crash_market_bottom_confirmation.json
          git diff --cached --quiet && exit 0
          git commit -m "Run crash market bottom confirmation"
          git pull --rebase origin main
          git push
