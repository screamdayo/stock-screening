name: Pinch Sector Cap Test
on:
  workflow_dispatch:
  push:
    paths: ['scripts/analyze_pinch_sector_cap.py']
permissions: {contents: write}
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install pandas requests
      - run: python scripts/analyze_pinch_sector_cap.py
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/pinch_candidate_sector_cap.json
          git diff --cached --quiet && exit 0
          git commit -m "Run pinch sector cap test"
          git pull --rebase origin main
          git push
