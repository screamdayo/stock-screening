name: Kuitto Watch Duel
on:
  push:
    paths: ['scripts/analyze_kuitto_watch_duel.py', '.github/workflows/kuitto_watch_duel.yml']
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Checkout private J-Quants data
        uses: actions/checkout@v4
        with:
          repository: screamdayo/stock-screening-data
          token: ${{ secrets.STOCK_SCREENING_DATA_TOKEN }}
          path: .private-data
          sparse-checkout: |
            data/batches
            data/daily_updates
          sparse-checkout-cone-mode: false
      - name: Mount private data
        run: |
          mkdir -p data
          ln -sfn "$GITHUB_WORKSPACE/.private-data/data/batches" data/batches
          ln -sfn "$GITHUB_WORKSPACE/.private-data/data/daily_updates" data/daily_updates
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install pandas pyarrow numpy
      - run: python scripts/analyze_kuitto_watch_duel.py
      - uses: actions/upload-artifact@v4
        with:
          name: kuitto-watch-duel
          path: results/kuitto_watch_duel.json
