name: くいっと除外群高速分析

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  analyze:
    if: startsWith(github.event.issue.title, '[kuitto-rejected-fast]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 固定CSVで除外群分析
        run: python compare_kuitto_rejected_policy.py
      - name: Issueへ結果投稿
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body-file output/kuitto_rejected_policy.txt