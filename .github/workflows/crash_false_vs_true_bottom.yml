name: Crash False vs True Bottom
on:
  workflow_dispatch:
  push:
    paths: ['scripts/analyze_crash_false_vs_true_bottom.py']
permissions: {contents: write}
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install pandas
      - run: python scripts/analyze_crash_false_vs_true_bottom.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/crash_false_vs_true_bottom.json
          git diff --cached --quiet && exit 0
          git commit -m "Run false vs true crash bottom diagnostic"
          git pull --rebase origin main
          git push
