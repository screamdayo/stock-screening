name: High Breakout Signal Crowding

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/analyze_high_breakout_signal_crowding.py'

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy
      - name: Run signal crowding analysis
        run: python scripts/analyze_high_breakout_signal_crowding.py
      - name: Commit result
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/high_breakout_signal_crowding.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Run high breakout signal crowding analysis"
          git pull --rebase origin main
          git push origin HEAD:main
