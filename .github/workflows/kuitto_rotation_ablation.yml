name: くいっと入替アブレーション
on:
  issues:
    types: [opened]
permissions:
  contents: read
  issues: write
jobs:
  analyze:
    if: startsWith(github.event.issue.title, '[kuitto-rotation-ablation]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pandas requests
      - run: python compare_kuitto_rotation_ablation.py
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body-file output/kuitto_rotation_ablation.txt