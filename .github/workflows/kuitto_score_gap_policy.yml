name: くいっとスコア別ギャップ合成

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  analyze:
    if: startsWith(github.event.issue.title, '[kuitto-gap-policy-fast]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 固定CSVで合成比較
        run: python compare_kuitto_score_gap_policy.py
      - name: Issueへ結果投稿
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat output/kuitto_score_gap_policy.txt > /tmp/result.md
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body-file /tmp/result.md