name: GC Seq2 Strong Breakout Robustness

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/analyze_gc_seq2_strong_breakout.py'

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas
      - name: Analyze frozen strong-breakout branch
        run: python scripts/analyze_gc_seq2_strong_breakout.py
      - name: Commit result
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/gc_seq2_strong_breakout_robustness.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Run GC strong-breakout robustness check"
          git pull --rebase origin main
          git push origin HEAD:main
