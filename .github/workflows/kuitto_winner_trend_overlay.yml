name: Kuitto Winner Trend Overlay Scan
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/analyze_kuitto_winner_trend_overlay.py'
      - '.github/workflows/kuitto_winner_trend_overlay.yml'
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install pandas
      - run: python scripts/analyze_kuitto_winner_trend_overlay.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/kuitto_winner_trend_overlay_scan.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Run kuitto winner trend overlay scan"
          git pull --rebase origin main
          git push
