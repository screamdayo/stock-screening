name: くいっと疑似OOS期間分割
on:
  issues:
    types: [opened]
permissions:
  contents: read
  issues: write
jobs:
  analyze:
    if: startsWith(github.event.issue.title, '[kuitto-pseudo-oos-split]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python compare_kuitto_pseudo_oos_split.py
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body-file output/kuitto_pseudo_oos_split.txt