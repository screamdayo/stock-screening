name: くいっとギャップルール直接対決
on:
  issues:
    types: [opened]
permissions:
  contents: read
  issues: write
jobs:
  analyze:
    if: startsWith(github.event.issue.title, '[kuitto-policy-duel]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python compare_kuitto_policy_duel.py
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body-file output/kuitto_policy_duel.txt