name: Momentum6M Monthly Discord Notify

on:
  schedule:
    - cron: "0 22 1 * *" # 毎月2日 07:00 JST（データ側の月次レポートは1日 19:00 JST に生成）
  workflow_dispatch:
    inputs:
      allow_stale:
        description: "対象月が前月でなくても通知する"
        required: false
        type: boolean
        default: true
  push:
    branches: [main] # ブランチへのプッシュでは通知しない
    paths:
      - 'trigger/momentum6m_notify.txt'

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Checkout the private monthly report only
        uses: actions/checkout@v4
        with:
          repository: screamdayo/stock-screening-data
          token: ${{ secrets.STOCK_SCREENING_DATA_TOKEN }}
          path: .private-data
          sparse-checkout: |
            results/momentum6m_monthly_latest.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Notify Discord (result only)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ALLOW_STALE: ${{ github.event_name != 'schedule' && (github.event_name == 'push' || inputs.allow_stale) }}
        run: |
          if [ "$ALLOW_STALE" = "true" ]; then
            python scripts/notify_momentum6m.py --allow-stale
          else
            python scripts/notify_momentum6m.py
          fi
