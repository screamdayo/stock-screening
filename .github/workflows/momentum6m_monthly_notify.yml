name: Momentum6M Monthly Report & Discord Notify

on:
  schedule:
    - cron: "0 22 1 * *" # 毎月2日 07:00 JST（データ側の月次データ更新は1日 19:00 JST）
  workflow_dispatch:
    inputs:
      allow_stale:
        description: "対象月が前月でなくても通知する"
        required: false
        type: boolean
        default: true
      signal_month:
        description: "対象月 YYYY-MM（空欄なら前月）"
        required: false
        type: string
      notify:
        description: "Discordに通知する（オフならレポート作成の確認だけ）"
        required: false
        type: boolean
        default: true
  push:
    branches: [main] # ブランチへのプッシュでは通知しない
    paths:
      - 'trigger/momentum6m_notify.txt'

permissions:
  contents: read # this repo is only read; the report is pushed to the private repo with its own token

jobs:
  report-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Checkout private J-Quants data
        uses: actions/checkout@v4
        with:
          repository: screamdayo/stock-screening-data
          token: ${{ secrets.STOCK_SCREENING_DATA_TOKEN }}
          path: .private-data
          sparse-checkout: |
            data/batches
            data/daily_updates
            data/margin_interest
          sparse-checkout-cone-mode: false

      - name: Mount private data
        run: |
          mkdir -p data
          for d in batches daily_updates margin_interest; do
            ln -sfn "$GITHUB_WORKSPACE/.private-data/data/$d" "data/$d"
          done

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas pyarrow requests

      # 候補レポートは .momentum6m/latest.json にだけ書く（コミットしない・ログは件数のみ）
      - name: Generate monthly report
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          SIGNAL_MONTH: ${{ inputs.signal_month }}
        run: |
          if [ -n "$SIGNAL_MONTH" ]; then
            python scripts/momentum6m_report.py --signal-month "$SIGNAL_MONTH"
          else
            python scripts/momentum6m_report.py
          fi

      - name: Notify Discord (result only)
        if: github.event_name != 'workflow_dispatch' || inputs.notify
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ALLOW_STALE: ${{ github.event_name != 'schedule' && (github.event_name == 'push' || inputs.allow_stale) }}
        run: |
          if [ "$ALLOW_STALE" = "true" ]; then
            python scripts/notify_momentum6m.py --allow-stale
          else
            python scripts/notify_momentum6m.py
          fi

      # 銘柄入りのレポートは公開リポジトリには置かず、非公開の stock-screening-data にだけ保存する
      # 通知の後に実行するので、保存に失敗しても通知は止まらない（失敗は赤く表示される）
      - name: Checkout private repo for saving the report
        if: always() && hashFiles('.momentum6m/latest.json') != ''
        uses: actions/checkout@v4
        with:
          repository: screamdayo/stock-screening-data
          token: ${{ secrets.STOCK_SCREENING_DATA_TOKEN }}
          path: .private-report
          sparse-checkout: |
            results/momentum6m_signals
            results/momentum6m_monthly_latest.json
          sparse-checkout-cone-mode: false

      - name: Save report to the private repo
        if: always() && hashFiles('.momentum6m/latest.json') != ''
        run: |
          set -euo pipefail
          month=$(python -c "import json;print(json.load(open('.momentum6m/latest.json'))['signal_month'])")
          mkdir -p .private-report/results/momentum6m_signals
          cp .momentum6m/latest.json ".private-report/results/momentum6m_signals/${month}.json"
          cp .momentum6m/latest.json .private-report/results/momentum6m_monthly_latest.json
          cd .private-report
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse "results/momentum6m_signals/${month}.json" results/momentum6m_monthly_latest.json
          if git diff --cached --quiet; then
            echo "report unchanged"
            exit 0
          fi
          git commit -q -m "Save monthly Momentum6M report ${month}"
          for i in 1 2 3; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep 5
          done
          echo "could not push the report to stock-screening-data" >&2
          exit 1
