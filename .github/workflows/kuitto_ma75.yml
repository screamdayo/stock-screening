name: Kuitto x MA75

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Checkout private J-Quants data
        uses: actions/checkout@v4
        with:
          repository: screamdayo/stock-screening-data
          token: ${{ secrets.STOCK_SCREENING_DATA_TOKEN }}
          path: .private-data
          sparse-checkout: |
            data/batches
            data/daily_updates
            results/kuitto_runner_features_trades.csv
            results/kuitto_ma25_gap_fourway_10y.csv
          sparse-checkout-cone-mode: false

      - name: Mount private data
        run: |
          mkdir -p data private_results
          for d in batches daily_updates; do
            ln -sfn "$GITHUB_WORKSPACE/.private-data/data/$d" "data/$d"
          done
          for f in kuitto_runner_features_trades.csv kuitto_ma25_gap_fourway_10y.csv; do
            ln -sfn "$GITHUB_WORKSPACE/.private-data/results/$f" "private_results/$f"
          done

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas pyarrow numpy
      - run: python scripts/analyze_kuitto_ma75.py
      - name: Commit results (aggregate statistics only)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/kuitto_ma75.json
          git diff --cached --quiet || git commit -m "Kuitto x MA75 research results"
          git pull --rebase origin main
          git push origin HEAD:main
