name: Tune screening swipe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tune_screening_swipe.yml'

permissions:
  contents: write

jobs:
  tune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make horizontal swipe stricter
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/screening.html')
          s = path.read_text(encoding='utf-8')
          old = "let tx=null;document.addEventListener('touchstart',e=>{if(S.mode==='today')tx=e.changedTouches[0].clientX},{passive:true});document.addEventListener('touchend',e=>{if(tx==null||S.mode!=='today')return;let d=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(d)>70)move(d>0?-1:1)},{passive:true});load();"
          new = "let tx=null,ty=null;document.addEventListener('touchstart',e=>{if(S.mode!=='today')return;let t=e.changedTouches[0];tx=t.clientX;ty=t.clientY},{passive:true});document.addEventListener('touchend',e=>{if(tx==null||ty==null||S.mode!=='today'){tx=ty=null;return}let t=e.changedTouches[0],dx=t.clientX-tx,dy=t.clientY-ty;tx=ty=null;if(Math.abs(dx)>=100&&Math.abs(dx)>=Math.abs(dy)*1.7)move(dx>0?-1:1)},{passive:true});load();"
          if old not in s:
              raise SystemExit('old swipe handler not found')
          path.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit swipe tuning
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/screening.html
          git commit -m 'fix: prevent vertical scroll from triggering swipe'
          git push
