name: Reversal 2019 Failure Diagnostic
on:
  workflow_dispatch:
  push:
    paths: ['scripts/analyze_reversal_2019_vs_good_years.py']
permissions: {contents: write}
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install pandas
      - run: python scripts/analyze_reversal_2019_vs_good_years.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/reversal_2019_vs_good_years_diagnostic.json
          git diff --cached --quiet && exit 0
          git commit -m "Run 2019 reversal failure diagnostic"
          git pull --rebase origin main
          git push
