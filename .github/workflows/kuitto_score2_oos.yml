name: くいっと2点分解疑似OOS
on:
  issues:
    types: [opened]
permissions:
  contents: read
  issues: write
jobs:
  analyze:
    if: startsWith(github.event.issue.title, '[kuitto-score2-oos]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python compare_kuitto_score2_split_oos.py
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body-file output/kuitto_score2_split_oos.txt