name: GC 条件5本 並列バックテスト

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  prepare:
    if: startsWith(github.event.issue.title, '[gc-parallel-trigger]')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: 株価データキャッシュ復元
        uses: actions/cache/restore@v4
        with:
          path: data/
          key: backtest-price-cache-v1-${{ github.run_id }}
          restore-keys: |
            backtest-price-cache-v1-
      - name: 5年株価キャッシュ準備
        env: {JQUANTS_API_KEY: "${{ secrets.JQUANTS_API_KEY }}"}
        run: |
          python - <<'PY'
          import download
          download.get_price_history_incremental(
              cache_filename="backtest_prices_prime_5y.csv",
              years=5,
          )
          PY
      - name: データ共有
        uses: actions/upload-artifact@v4
        with:
          name: gc-parallel-data-${{ github.run_id }}
          path: data/
          retention-days: 1

  test:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        test: [volume, candle, cross_gap, below_days, ma25_strength]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: 共有株価データ取得
        uses: actions/download-artifact@v4
        with:
          name: gc-parallel-data-${{ github.run_id }}
          path: data/
      - name: 条件別バックテスト
        env: {JQUANTS_API_KEY: "${{ secrets.JQUANTS_API_KEY }}"}
        run: python compare_gc_parallel_conditions.py --test "${{ matrix.test }}"
      - name: Issueへ結果を投稿
        if: success()
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          file="output/gc_parallel_${{ matrix.test }}.txt"
          { echo "## GC並列テスト: ${{ matrix.test }}"; echo '```text'; cat "$file"; echo '```'; } > /tmp/result.md
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body-file /tmp/result.md
      - name: 結果保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gc-parallel-${{ matrix.test }}-${{ github.run_id }}
          path: output/
          retention-days: 14
          if-no-files-found: ignore
