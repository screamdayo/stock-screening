name: Kuitto No Visual Test

on:
  push:
    branches:
      - kuitto-no-visual

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile changed Python
        run: python -m py_compile main.py notifier.py strategies/registry.py strategies/kuitto_pullback_auto.py
      - name: Test strategy on saved prices
        run: |
          python - <<'PY'
          import glob, json, os
          import pandas as pd
          from strategies import kuitto_pullback_auto

          frames=[]
          codes=[]
          for path in glob.glob('docs/prices/*.json'):
              code=os.path.basename(path).replace('.json','')
              if code.startswith('_'):
                  continue
              try:
                  rows=json.load(open(path,encoding='utf-8'))
              except Exception:
                  continue
              if not rows:
                  continue
              df=pd.DataFrame(rows)
              if not {'t','o','h','l','c'}.issubset(df.columns):
                  continue
              rename={'t':'Date','o':'O','h':'H','l':'L','c':'C','v':'Vo'}
              df=df.rename(columns={k:v for k,v in rename.items() if k in df.columns})
              df['Code']=code
              frames.append(df)
              codes.append(code)
          prices=pd.concat(frames,ignore_index=True)
          latest=kuitto_pullback_auto.find_latest_signals(prices,codes)
          signals,_=kuitto_pullback_auto.find_signals(prices,codes)
          print(f'latest={len(latest)} historical={len(signals)}')
          assert all(r.get('auto_filtered') is True for r in latest)
          assert all(r['signal_type']=='kuitto_pullback_auto' for r in latest)
          PY
