name: Sharp Drop Reversal Strength

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/analyze_sharp_drop_reversal_strength.py'

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy
      - run: python scripts/analyze_sharp_drop_reversal_strength.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/sharp_drop_reversal_strength_scan.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Run sharp drop reversal strength scan"
          git pull --rebase origin main
          git push
