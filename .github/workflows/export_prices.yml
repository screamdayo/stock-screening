name: 株価データ更新（GitHub Pages用）

on:
  schedule:
    - cron: '30 7 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  export-prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ライブラリインストール
        run: pip install -r requirements.txt

      - name: 株価・スクリーニングデータをGitHub Pages用に出力
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
        run: python export_docs_prices.py

      - name: GitHub Pages用データをcommit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/prices/ docs/screening.json
          git diff --cached --quiet && echo "変更なし" || git commit -m "chore: docsデータを更新"
          git push
