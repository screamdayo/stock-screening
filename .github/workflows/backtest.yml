name: バックテスト

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "実行モード"
        required: true
        default: "normal"
        type: choice
        options:
          - normal
          - sweep-pattern
          - ranking
          - yearly-exit
      strategy:
        description: "戦略名（strategies/registry.pyに登録されているもの）"
        required: false
        default: "ma5_breakout"
        type: string
      condition:
        description: "MA判定方式（modeがnormalのときのみ使用）"
        required: false
        default: "config"
        type: choice
        options:
          - config
          - rising
          - turning
          - pattern
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  backtest:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, '[yearly-backtest-trigger]')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ライブラリインストール
        run: pip install -r requirements.txt

      - name: 株価データキャッシュの復元
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: data/
          key: backtest-price-cache-v1-${{ github.run_id }}
          restore-keys: |
            backtest-price-cache-v1-

      - name: 通常バックテスト実行
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'normal'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
        run: >
          python run_backtest.py
          --strategy "${{ github.event.inputs.strategy }}"
          --condition "${{ github.event.inputs.condition }}"

      - name: パラメータスイープ実行
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'sweep-pattern'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
        run: >
          python run_backtest.py
          --strategy "${{ github.event.inputs.strategy }}"
          --sweep-pattern

      - name: 最大8枠 同日候補ランキング検証実行
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'ranking'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
        run: |
          python run_backtest_ranking.py
          python analyze_balanced_mark_to_market.py

      - name: 5年・1年区切り 利確5% vs がくっと比較
        if: (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'yearly-exit') || (github.event_name == 'issues' && startsWith(github.event.issue.title, '[yearly-backtest-trigger]'))
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
        run: python compare_exit_yearly.py

      - name: Issueへ比較結果を投稿
        if: github.event_name == 'issues' && success() && startsWith(github.event.issue.title, '[yearly-backtest-trigger]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '## 5年・年別バックテスト結果'
            echo '```text'
            cat output/yearly_exit_comparison.txt
            echo '```'
          } > /tmp/result.md
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body-file /tmp/result.md

      - name: 株価データキャッシュの保存
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/
          key: backtest-price-cache-v1-${{ github.run_id }}

      - name: 結果ファイルをアーティファクトとして保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-output-${{ github.run_id }}
          path: |
            output/
            logs/
          retention-days: 14
          if-no-files-found: ignore
