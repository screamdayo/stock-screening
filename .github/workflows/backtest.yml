name: バックテスト

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "実行モード"
        required: true
        default: "normal"
        type: choice
        options:
          - normal
          - sweep-pattern
          - ranking
          - yearly-exit
          - ma25-filter
          - ma-distance
          - stable-combo
          - liquidity
          - capital-risk
          - profit-rotation
      strategy:
        description: "戦略名（strategies/registry.pyに登録されているもの）"
        required: false
        default: "ma5_breakout"
        type: string
      condition:
        description: "MA判定方式（modeがnormalのときのみ使用）"
        required: false
        default: "config"
        type: choice
        options: [config, rising, turning, pattern]
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  backtest:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, '[yearly-backtest-trigger]') || startsWith(github.event.issue.title, '[ma25-backtest-trigger]') || startsWith(github.event.issue.title, '[ma-distance-backtest-trigger]') || startsWith(github.event.issue.title, '[stable-combo-backtest-trigger]') || startsWith(github.event.issue.title, '[liquidity-backtest-trigger]') || startsWith(github.event.issue.title, '[capital-risk-backtest-trigger]') || startsWith(github.event.issue.title, '[rotation-backtest-trigger]')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: ライブラリインストール
        run: pip install -r requirements.txt
      - name: 株価データキャッシュの復元
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: data/
          key: backtest-price-cache-v1-${{ github.run_id }}
          restore-keys: |
            backtest-price-cache-v1-
      - name: 通常バックテスト実行
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'normal'
        env: {DISCORD_WEBHOOK_URL: "${{ secrets.DISCORD_WEBHOOK_URL }}", JQUANTS_API_KEY: "${{ secrets.JQUANTS_API_KEY }}"}
        run: python run_backtest.py --strategy "${{ github.event.inputs.strategy }}" --condition "${{ github.event.inputs.condition }}"
      - name: パラメータスイープ実行
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'sweep-pattern'
        env: {DISCORD_WEBHOOK_URL: "${{ secrets.DISCORD_WEBHOOK_URL }}", JQUANTS_API_KEY: "${{ secrets.JQUANTS_API_KEY }}"}
        run: python run_backtest.py --strategy "${{ github.event.inputs.strategy }}" --sweep-pattern
      - name: 最大8枠 同日候補ランキング検証実行
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'ranking'
        env: {DISCORD_WEBHOOK_URL: "${{ secrets.DISCORD_WEBHOOK_URL }}", JQUANTS_API_KEY: "${{ secrets.JQUANTS_API_KEY }}"}
        run: |
          python run_backtest_ranking.py
          python analyze_balanced_mark_to_market.py
      - name: 5年・1年区切り 利確5% vs がくっと比較
        if: (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'yearly-exit') || (github.event_name == 'issues' && startsWith(github.event.issue.title, '[yearly-backtest-trigger]'))
        env: {JQUANTS_API_KEY: "${{ secrets.JQUANTS_API_KEY }}"}
        run: python compare_exit_yearly.py
      - name: MA25向きフィルター 5年比較
        if: (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'ma25-filter') || (github.event_name == 'issues' && startsWith(github.event.issue.title, '[ma25-backtest-trigger]'))
        env: {JQUANTS_API_KEY: "${{ secrets.JQUANTS_API_KEY }}"}
        run: python compare_ma25_filter.py
      - name: MA5/MA25距離フィルター 5年比較
        if: (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'ma-distance') || (github.event_name == 'issues' && startsWith(github.event.issue.title, '[ma-distance-backtest-trigger]'))
        env: {JQUANTS_API_KEY: "${{ secrets.JQUANTS_API_KEY }}"}
        run: python compare_ma_distance.py
      - name: 安定条件かけ合わせ 5年比較
        if: (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'stable-combo') || (github.event_name == 'issues' && startsWith(github.event.issue.title, '[stable-combo-backtest-trigger]'))
        env: {JQUANTS_API_KEY: "${{ secrets.JQUANTS_API_KEY }}"}
        run: python compare_stable_combo.py
      - name: 流動性フィルター 5年比較
        if: (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'liquidity') || (github.event_name == 'issues' && startsWith(github.event.issue.title, '[liquidity-backtest-trigger]'))
        env: {JQUANTS_API_KEY: "${{ secrets.JQUANTS_API_KEY }}"}
        run: python compare_liquidity.py
      - name: 資産・最大DD 5年比較
        if: (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'capital-risk') || (github.event_name == 'issues' && startsWith(github.event.issue.title, '[capital-risk-backtest-trigger]'))
        env: {JQUANTS_API_KEY: "${{ secrets.JQUANTS_API_KEY }}"}
        run: python compare_capital_risk.py
      - name: 含み益利確・乗り換え 5年比較
        if: (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'profit-rotation') || (github.event_name == 'issues' && startsWith(github.event.issue.title, '[rotation-backtest-trigger]'))
        env: {JQUANTS_API_KEY: "${{ secrets.JQUANTS_API_KEY }}"}
        run: python compare_profit_rotation.py
      - name: Issueへ結果を投稿
        if: github.event_name == 'issues' && success()
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          if [[ "${{ github.event.issue.title }}" == \[yearly-backtest-trigger\]* ]]; then title='5年・年別バックテスト結果'; file='output/yearly_exit_comparison.txt';
          elif [[ "${{ github.event.issue.title }}" == \[ma25-backtest-trigger\]* ]]; then title='MA25向きフィルター 5年バックテスト結果'; file='output/ma25_filter_comparison.txt';
          elif [[ "${{ github.event.issue.title }}" == \[ma-distance-backtest-trigger\]* ]]; then title='MA5/MA25距離フィルター 5年バックテスト結果'; file='output/ma_distance_comparison.txt';
          elif [[ "${{ github.event.issue.title }}" == \[stable-combo-backtest-trigger\]* ]]; then title='安定条件かけ合わせ 5年バックテスト結果'; file='output/stable_combo_comparison.txt';
          elif [[ "${{ github.event.issue.title }}" == \[liquidity-backtest-trigger\]* ]]; then title='流動性フィルター 5年バックテスト結果'; file='output/liquidity_filter_comparison.txt';
          elif [[ "${{ github.event.issue.title }}" == \[capital-risk-backtest-trigger\]* ]]; then title='100万円スタート・最大DD比較結果'; file='output/capital_risk_comparison.txt';
          elif [[ "${{ github.event.issue.title }}" == \[rotation-backtest-trigger\]* ]]; then title='含み益利確・乗り換え 5年比較結果'; file='output/profit_rotation_comparison.txt'; else exit 0; fi
          { echo "## $title"; echo '```text'; cat "$file"; echo '```'; } > /tmp/result.md
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body-file /tmp/result.md
      - name: 株価データキャッシュの保存
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/
          key: backtest-price-cache-v1-${{ github.run_id }}
      - name: 結果ファイルをアーティファクトとして保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-output-${{ github.run_id }}
          path: |
            output/
            logs/
          retention-days: 14
          if-no-files-found: ignore
