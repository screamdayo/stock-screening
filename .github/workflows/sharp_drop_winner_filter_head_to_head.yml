name: Sharp Drop Winner Filter Head-to-Head

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/analyze_sharp_drop_winner_filter_head_to_head.py'
      - '.github/workflows/sharp_drop_winner_filter_head_to_head.yml'

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy
      - run: python scripts/analyze_sharp_drop_winner_filter_head_to_head.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/sharp_drop_winner_filter_head_to_head.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Run sharp drop winner filter head-to-head"
          git pull --rebase origin main
          git push
