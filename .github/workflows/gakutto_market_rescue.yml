name: Gakutto Market Rescue Study

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/analyze_gakutto_market_rescue.py'
      - '.github/workflows/gakutto_market_rescue.yml'

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout public code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout private J-Quants data
        uses: actions/checkout@v4
        with:
          repository: screamdayo/stock-screening-data
          token: ${{ secrets.STOCK_SCREENING_DATA_TOKEN }}
          path: .private-data
          sparse-checkout: |
            data/batches
            data/topix
          sparse-checkout-cone-mode: false

      - name: Mount private data
        run: |
          mkdir -p data
          ln -sfn "$GITHUB_WORKSPACE/.private-data/data/batches" data/batches
          ln -sfn "$GITHUB_WORKSPACE/.private-data/data/topix" data/topix

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas pyarrow numpy

      - name: Run analysis
        run: python scripts/analyze_gakutto_market_rescue.py

      - name: Commit results
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/gakutto_market_rescue_summary.json results/gakutto_market_rescue_variants.csv
          if git diff --cached --quiet; then
            echo "No result changes."
          else
            git commit -m "Run broad-market gakutto rescue study"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
