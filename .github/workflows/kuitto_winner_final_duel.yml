name: Kuitto Winner Final Duel
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/analyze_kuitto_winner_final_duel.py'
      - '.github/workflows/kuitto_winner_final_duel.yml'
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy
      - run: python scripts/analyze_kuitto_winner_final_duel.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/kuitto_winner_final_duel.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Run kuitto winner final duel"
          git pull --rebase origin main
          git push
