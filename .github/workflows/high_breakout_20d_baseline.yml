name: 20D High Breakout Baseline

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/backtest_high_breakout_20d_baseline.py'

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout private J-Quants data
        uses: actions/checkout@v4
        with:
          repository: screamdayo/stock-screening-data
          token: ${{ secrets.STOCK_SCREENING_DATA_TOKEN }}
          path: .private-data
          sparse-checkout: |
            data/batches
          sparse-checkout-cone-mode: false
      - name: Mount private data
        run: |
          mkdir -p data
          ln -sfn "$GITHUB_WORKSPACE/.private-data/data/batches" data/batches
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas pyarrow numpy
      - name: Run backtest
        run: python scripts/backtest_high_breakout_20d_baseline.py
      - name: Commit result
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/high_breakout_20d_baseline.json results/high_breakout_20d_trades.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Run 20-day high breakout baseline"
          git pull --rebase origin main
          git push origin HEAD:main
