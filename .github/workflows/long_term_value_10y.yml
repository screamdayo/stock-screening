name: Long-term Value 10Y Research

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout public code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout private J-Quants data
        uses: actions/checkout@v4
        with:
          repository: screamdayo/stock-screening-data
          token: ${{ secrets.STOCK_SCREENING_DATA_TOKEN }}
          path: .private-data
          sparse-checkout: |
            data/batches
            data/daily_updates
            data/delisted
            data/master_history
            data/fins_summary
          sparse-checkout-cone-mode: false

      - name: Mount private data
        run: |
          mkdir -p data
          for d in batches daily_updates delisted master_history fins_summary; do
            ln -sfn "$GITHUB_WORKSPACE/.private-data/data/$d" "data/$d"
          done

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas pyarrow numpy
      - run: python scripts/analyze_long_term_value_10y.py
      - name: Commit results (aggregate statistics only)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/long_term_value_10y.json
          git diff --cached --quiet || git commit -m "Long-term value 10Y research results"
          git pull --rebase origin main
          git push origin HEAD:main
