name: Pinch To Chance Sensor Validation
on:
  workflow_dispatch:
  push:
    paths: ['scripts/validate_pinch_to_chance_sensor.py']
permissions: {contents: write}
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install pandas requests
      - run: python scripts/validate_pinch_to_chance_sensor.py
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/pinch_to_chance_sensor_validation.json
          git diff --cached --quiet && exit 0
          git commit -m "Validate pinch to chance sensor"
          git pull --rebase origin main
          git push
